年》和北京大学", "内容之一：抨击旧道德和旧文化，鲁迅《狂人日记》以白话文揭露封建礼教", "内容之二：提倡民主与科学，即“德先生”和“赛先生”", "内容之三：文学革命，胡适《文学改良刍议》主张白话文，陈独秀《文学革命论》", "影响：动摇了封建道德礼教的统治地位，促进思想解放，为五四运动作了思想准备", "局限：对东西方文化的看法存在绝对肯定或绝对否定的偏向"], "重难点": "新文化运动的内容与历史影响", "易错点": "兴起标志是 1915 年创办《青年杂志》，改名《新青年》是次年的事；民主与科学对应“德先生”“赛先生”，不要与“自强”“求富”混；新文化运动性质是思想解放运动，不是政治运动或革命运动；评价必须辩证，既要讲解放作用，也要讲绝对化偏向", "教学建议": "从“制度换了，人心没换”破题——辛亥革命建立了共和，为什么袁世凯还要尊孔？把新文化运动放进这个困境里，学生才理解它为何必须发生；用《狂人日记》白话原文与文言文改写片段对读，让学生直观感受“文学革命”的意义", "状态": "已定稿", "正文": "## 板书提纲\n\n```\n新文化运动（1915—）\n├─ 背景：共和已立，尊孔复古逆流\n├─ 标志：1915 《青年杂志》（次年改《新青年》）\n├─ 人物：陈独秀、胡适、李大钊、鲁迅\n├─ 阵地：《新青年》+ 北京大学\n├─ 内容\n│   ├─ 破：旧道德旧文化\n│   ├─ 立：民主（德先生）、科学（赛先生）\n│   └─ 形式：白话文\n└─ 影响：思想解放 → 为五四准备 / 局限：绝对化\n```\n\n## 材料研读\n\n“我翻开历史一查……每页都写着‘仁义道德’几个字……仔细看了半夜……满本都写着两个字是‘吃人’！”——鲁迅《狂人日记》\n\n设问：鲁迅批判的是什么？他为什么用白话文来写？\n（要点：批判以“仁义道德”为名的封建礼教；白话文让普通读者能读懂，思想启蒙必须先从语言上打破门槛。）\n\n## 课堂小结一句话\n\n他们争的不只是文言与白话，而是中国人该用什么样的头脑来想问题。", "正文HTML": "<h2>板书提纲</h2>\n<pre><code>新文化运动（1915—）\n├─ 背景：共和已立，尊孔复古逆流\n├─ 标志：1915 《青年杂志》（次年改《新青年》）\n├─ 人物：陈独秀、胡适、李大钊、鲁迅\n├─ 阵地：《新青年》+ 北京大学\n├─ 内容\n│   ├─ 破：旧道德旧文化\n│   ├─ 立：民主（德先生）、科学（赛先生）\n│   └─ 形式：白话文\n└─ 影响：思想解放 → 为五四准备 / 局限：绝对化\n</code></pre>\n<h2>材料研读</h2>\n<p>“我翻开历史一查……每页都写着‘仁义道德’几个字……仔细看了半夜……满本都写着两个字是‘吃人’！”——鲁迅《狂人日记》</p>\n<p>设问：鲁迅批判的是什么？他为什么用白话文来写？<br />\n（要点：批判以“仁义道德”为名的封建礼教；白话文让普通读者能读懂，思想启蒙必须先从语言上打破门槛。）</p>\n<h2>课堂小结一句话</h2>\n<p>他们争的不只是文言与白话，而是中国人该用什么样的头脑来想问题。</p>", "路径": "index/八年级上册/第12课-新文化运动.md"}, {"册别": "八年级下册", "单元": "第一单元 中华人民共和国的成立和巩固", "课序": 1, "课题": "中华人民共和国成立", "课标": "讲述开国大典，认识中华人民共和国成立的意义。", "素养": ["时空观念", "史料实证", "家国情怀"], "关键词": ["开国大典", "共同纲领", "一届政协", "西藏和平解放", "新纪元"], "知识点": ["第一届政协：1949 年 9 月在北平召开，通过《共同纲领》，起临时宪法作用；确定国旗、国歌、国都、纪年；选举毛泽东为中央人民政府主席", "开国大典：1949 年 10 月 1 日，天安门广场，宣告中华人民共和国中央人民政府成立", "西藏和平解放：1951 年，西藏地方政府派代表到北京谈判并签订协议，标志祖国大陆获得统一", "国内意义：开辟了中国历史新纪元，中国人民从此站起来了，成为国家的主人", "国际意义：壮大了世界和平民主和社会主义的力量"], "重难点": "开国大典的过程与新中国成立的历史意义", "易错点": "《共同纲领》起临时宪法作用，不是正式宪法，第一部宪法是 1954 年；西藏和平解放标志“祖国大陆获得统一”，表述要准确，不要写成“全国统一”；一届政协代行全国人大职权，1954 年人大召开后政协转为统一战线组织", "教学建议": "用一条时间轴串起“政协—大典—西藏”（1949.9—1949.10.1—1951），让学生看清“建国”是一个过程而非一个瞬间；播放《义勇军进行曲》原始录音并讲清“中华民族到了最危险的时候”为何保留不改，做情感落点", "状态": "待复核", "正文": "## 板书提纲\n\n```\n中华人民共和国成立\n├─ 筹备：1949.9 一届政协（北平）\n│   └─ 《共同纲领》——临时宪法\n├─ 成立：1949.10.1 开国大典\n├─ 统一：1951 西藏和平解放 → 大陆统一\n└─ 意义\n    ├─ 国内：新纪元，人民当家作主\n    └─ 国际：壮大和平民主与社会主义力量\n```\n\n## 材料研读\n\n“诸位代表先生们，我们有一个共同的感觉，这就是我们的工作将写在人类的历史上，它将表明：占人类总数四分之一的中国人从此站立起来了。”——毛泽东在一届政协开幕式上的开幕词\n\n设问：“站立起来”具体指什么？用本课史实说明。\n（要点：国家独立、人民成为国家主人、结束半殖民地半封建社会。）\n\n## 课堂小结一句话\n\n1949 年 10 月 1 日那面升起的旗，结束的是一百多年低头的历史。", "正文HTML": "<h2>板书提纲</h2>\n<pre><code>中华人民共和国成立\n├─ 筹备：1949.9 一届政协（北平）\n│   └─ 《共同纲领》——临时宪法\n├─ 成立：1949.10.1 开国大典\n├─ 统一：1951 西藏和平解放 → 大陆统一\n└─ 意义\n    ├─ 国内：新纪元，人民当家作主\n    └─ 国际：壮大和平民主与社会主义力量\n</code></pre>\n<h2>材料研读</h2>\n<p>“诸位代表先生们，我们有一个共同的感觉，这就是我们的工作将写在人类的历史上，它将表明：占人类总数四分之一的中国人从此站立起来了。”——毛泽东在一届政协开幕式上的开幕词</p>\n<p>设问：“站立起来”具体指什么？用本课史实说明。<br />\n（要点：国家独立、人民成为国家主人、结束半殖民地半封建社会。）</p>\n<h2>课堂小结一句话</h2>\n<p>1949 年 10 月 1 日那面升起的旗，结束的是一百多年低头的历史。</p>", "路径": "index/八年级下册/第01课-中华人民共和国成立.md"}, {"册别": "八年级下册", "单元": "第二单元 社会主义制度的建立与社会主义建设的探索", "课序": 5, "课题": "三大改造", "课标": "了解“三大改造”，知道中国确立社会主义基本制度的重大意义。", "素养": ["唯物史观", "历史解释", "家国情怀"], "关键词": ["农业生产合作社", "公私合营", "赎买政策", "社会主义基本制度", "1956"], "知识点": ["农业改造：1953 年起，国家引导农民组织起来，参加农业生产合作社，走集体化和共同富裕的道路", "手工业改造：引导手工业者组织手工业生产合作社", "资本主义工商业改造：从加工订货、统购包销到公私合营，实行赎买政策，实现了和平过渡", "赎买政策：国家按合营时资本家的资本付给定息，是社会主义改造的创举", "完成时间：1956 年底，三大改造基本完成", "实质：生产资料私有制向社会主义公有制转变", "意义：标志着社会主义基本制度在我国建立起来，我国进入社会主义初级阶段"], "重难点": "三大改造的实质；社会主义基本制度确立的意义", "易错点": "改造方式是合作社和公私合营，不是人民公社（人民公社化运动始于 1958 年，二者常被混）；对资本主义工商业实行的是赎买政策而非无偿没收，这是中国区别于苏联的做法；三大改造 1956 年底“基本完成”，表述不要写成“彻底完成”", "教学建议": "用“农民为什么愿意把地入股”做讨论，把改造讲成利益选择而不是单纯的政策推行；把赎买政策与苏联没收资本家财产对照，让学生看出中国道路的特殊性，这一处最容易出彩", "状态": "待复核", "正文": "## 板书提纲\n\n```\n三大改造（1953—1956）\n├─ 农业：农业生产合作社（集体化）\n├─ 手工业：手工业生产合作社\n├─ 资本主义工商业：公私合营 + 赎买（创举）\n├─ 实质：私有制 → 公有制\n└─ 意义：社会主义基本制度建立（1956 底基本完成）\n```\n\n## 对照：中国与苏联的改造方式\n\n| 比较项 | 苏联 | 中国 |\n| --- | --- | --- |\n| 对资本家 | 没收，驱逐或镇压 | 公私合营 + 赎买，给定息 |\n| 结果 | 对抗激烈 | 和平过渡 |\n\n设问：为什么中国能“和平过渡”？这说明了什么？\n（要点：民族资产阶级在民主革命中曾是同盟者；政策照顾了各方利益，减少了阻力。）\n\n## 课堂小结一句话\n\n1956 年底那道分界线，把中国从“新民主主义”送进了“社会主义”。", "正文HTML": "<h2>板书提纲</h2>\n<pre><code>三大改造（1953—1956）\n├─ 农业：农业生产合作社（集体化）\n├─ 手工业：手工业生产合作社\n├─ 资本主义工商业：公私合营 + 赎买（创举）\n├─ 实质：私有制 → 公有制\n└─ 意义：社会主义基本制度建立（1956 底基本完成）\n</code></pre>\n<h2>对照：中国与苏联的改造方式</h2>\n<table>\n<thead>\n<tr>\n<th>比较项</th>\n<th>苏联</th>\n<th>中国</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>对资本家</td>\n<td>没收，驱逐或镇压</td>\n<td>公私合营 + 赎买，给定息</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>对抗激烈</td>\n<td>和平过渡</td>\n</tr>\n</tbody>\n</table>\n<p>设问：为什么中国能“和平过渡”？这说明了什么？<br />\n（要点：民族资产阶级在民主革命中曾是同盟者；政策照顾了各方利益，减少了阻力。）</p>\n<h2>课堂小结一句话</h2>\n<p>1956 年底那道分界线，把中国从“新民主主义”送进了“社会主义”。</p>", "路径": "index/八年级下册/第05课-三大改造.md"}, {"册别": "八年级下册", "单元": "第三单元 中国特色社会主义道路", "课序": 8, "课题": "经济体制改革", "课标": "了解农村改革和社会主义市场经济体制的建立与完善。", "素养": ["唯物史观", "历史解释", "家国情怀"], "关键词": ["小岗村", "家庭联产承包责任制", "国有企业改革", "社会主义市场经济", "十四大"], "知识点": ["背景：十一届三中全会后，人民公社体制下“大锅饭”挫伤农民积极性，农业生产长期徘徊", "农村改革：1978 年安徽凤阳小岗村农民率先实行分田包干到户，随后推广为家庭联产承包责任制", "土地性质：土地仍归集体所有，农民获得生产经营自主权，改变的是经营方式而非所有制", "城市改革：1984 年起全面展开，重点是国有企业改革，扩大企业自主权，实行政企分开", "目标确立：1992 年中共十四大提出建立社会主义市场经济体制的目标", "意义：调动了生产者和经营者的积极性，促进了经济发展和人民生活水平提高"], "重难点": "家庭联产承包责任制的实质；社会主义市场经济体制目标的确立", "易错点": "家庭联产承包责任制没有改变土地公有制，说“分田到户把土地分给农民”是错的；提出建立社会主义市场经济体制目标的是 1992 年中共十四大；城市经济体制改革全面展开是 1984 年", "教学建议": "用小岗村“十八个红手印”契约原件照片导入，先问“他们为什么要冒这个险”；再做“一口锅吃饭”与“各家各户自己种”的收益对比推演，把“积极性”这个抽象词落到产量上", "状态": "已定稿", "正文": "## 板书提纲\n\n```\n经济体制改革\n├─ 农村（1978 起）\n│   └─ 小岗村 → 家庭联产承包责任制\n│       土地集体所有 + 经营自主权\n├─ 城市（1984 起）\n│   └─ 国企改革：扩权、政企分开\n└─ 目标（1992 十四大）\n    └─ 社会主义市场经济体制\n```\n\n## 材料研读\n\n小岗村契约：“我们分田到户，每户户主签字盖章，如以后能干，每户保证完成每户的全年上交和公粮，不再向国家伸手要钱要粮……”\n\n设问：这份契约里，农民向国家承诺了什么？他们承担了多大风险？\n（要点：保证完成上交和公粮、不再要救济；在当时被视为“违反政策”，风险是政治性的。）\n\n## 课堂小结一句话\n\n改革的起点不在会议室，而在十八户农民按下红手印的那张纸上。", "正文HTML": "<h2>板书提纲</h2>\n<pre><code>经济体制改革\n├─ 农村（1978 起）\n│   └─ 小岗村 → 家庭联产承包责任制\n│       土地集体所有 + 经营自主权\n├─ 城市（1984 起）\n│   └─ 国企改革：扩权、政企分开\n└─ 目标（1992 十四大）\n    └─ 社会主义市场经济体制\n</code></pre>\n<h2>材料研读</h2>\n 力度</td>\n<td>自上而下系统推行，持续数十年</td>\n<td>103 天即被镇压</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>走上资本主义道路</td>\n<td>失败，民族危机加深</td>\n</tr>\n</tbody>\n</table>\n<p>设问：同样的时代、同样的目标，为什么结果差这么远？<br />\n（要点：是否真正掌握政权、是否有稳定的推行时间、是否触动旧势力根基。）</p>\n<h2>课堂小结一句话</h2>\n<p>明治维新让日本站了起来，也让它的邻国从此不得安宁。</p>", "路径": "index/九年级下册/第04课-日本明治维新.md"}, {"册别": "九年级下册", "单元": "第五单元 二战后的世界变化", "课序": 16, "课题": "冷战", "课标": "知道杜鲁门主义、马歇尔计划、北约与华约的成立，了解冷战的表现和影响。", "素养": ["时空观念", "历史解释", "唯物史观"], "关键词": ["杜鲁门主义", "马歇尔计划", "北约", "华约", "两极格局"], "知识点": ["含义：第二次世界大战后，以美国、苏联为首的两大集团之间既非战争又非和平的对峙与竞争状态", "序幕：1946 年丘吉尔发表“铁幕演说”", "开始标志：1947 年杜鲁门主义出台，宣称要遏制共产主义", "经济表现：1947 年美国推行马歇尔计划，援助西欧恢复经济", "军事表现：1949 年北约成立；1955 年华约成立，两极格局正式形成", "其他表现：柏林危机与德国分裂、古巴导弹危机、朝鲜战争、越南战争", "结束：1991 年苏联解体，两极格局终结，冷战结束", "影响：双方势均力敌，避免了新的世界大战爆发；但局部战争不断，世界长期不得安宁"], "重难点": "冷战的表现与两极格局的形成；冷战的实质与影响", "易错点": "冷战开始的标志是 1947 年杜鲁门主义，不是 1946 年“铁幕演说”（那是序幕）；两极格局形成于 1955 年华约成立，不是北约成立；冷战结束的标志是 1991 年苏联解体", "教学建议": "用“一道铁幕”地图导入，标出北约与华约成员国，让抽象的“两极”变成可见的地理分割；古巴导弹危机可放 30 秒影像，问“人类离核战争有多远”，再回到“冷战为什么没有变成热战”的讨论", "状态": "已定稿", "正文": "## 板书提纲\n\n```\n冷战（1947—1991）\n├─ 序幕：1946 铁幕演说\n├─ 开始：1947 杜鲁门主义\n├─ 三根支柱\n│   ├─ 政治：杜鲁门主义\n│   ├─ 经济：马歇尔计划\n│   └─ 军事：北约（1949）\n├─ 对峙升级：华约（1955）→ 两极格局形成\n└─ 结束：1991 苏联解体\n```\n\n## 材料研读\n\n“从波罗的海的什切青到亚得里亚海的的里雅斯特，一幅横贯欧洲大陆的铁幕已经降落下来。”——丘吉尔 1946 年富尔顿演说\n\n设问：丘吉尔为什么用“铁幕”这个词？“幕”两边分别站着谁？\n（要点：形象化地描述欧洲被分割；一边是美国及西欧资本主义国家，一边是苏联及东欧社会主义国家。）\n\n## 课堂小结一句话\n\n冷战没有开一枪，却让整个世界在核阴影下站了四十年。", "正文HTML": "<h2>板书提纲</h2>\n<pre><code>冷战（1947—1991）\n├─ 序幕：1946 铁幕演说\n├─ 开始：1947 杜鲁门主义\n├─ 三根支柱\n│   ├─ 政治：杜鲁门主义\n│   ├─ 经济：马歇尔计划\n│   └─ 军事：北约（1949）\n├─ 对峙升级：华约（1955）→ 两极格局形成\n└─ 结束：1991 苏联解体\n</code></pre>\n<h2>材料研读</h2>\n<p>“从波罗的海的什切青到亚得里亚海的的里雅斯特，一幅横贯欧洲大陆的铁幕已经降落下来。”——丘吉尔 1946 年富尔顿演说</p>\n<p>设问：丘吉尔为什么用“铁幕”这个词？“幕”两边分别站着谁？<br />\n（要点：形象化地描述欧洲被分割；一边是美国及西欧资本主义国家，一边是苏联及东欧社会主义国家。）</p>\n<h2>课堂小结一句话</h2>\n<p>冷战没有开一枪，却让整个世界在核阴影下站了四十年。</p>", "路径": "index/九年级下册/第16课-冷战.md"}];
const list = document.getElementById('list');
let book = 'all', kw = '';
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render() {
  const rows = DATA.filter(d =>
    (book === 'all' || d['册别'] === book) &&
    (kw === '' || (d['课题'] + d['关键词'].join('') + d['知识点'].join('') + d['单元']).includes(kw))
  );
  if (!rows.length) { list.innerHTML = '<p style="color:#656d76">没有匹配的课时。</p>'; return; }
  list.innerHTML = rows.map((d, i) => `
    <details>
      <summary>
        <div class="title">${esc(d['册别'])} 第${d['课序']}课 ${esc(d['课题'])}
          <span class="badge s-${esc(d['状态'])}">${esc(d['状态'])}</span></div>
        <div class="meta">${esc(d['单元'])}</div>
        <div style="margin-top:6px">${d['关键词'].map(k => `<span class="kw">${esc(k)}</span>`).join('')}</div>
      </summary>
      <div class="block">
        <h3>课标要求</h3><p>${esc(d['课标'])}</p>
        <h3>核心素养</h3><p>${d['素养'].map(esc).join('、')}</p>
        <h3>知识点梳理</h3><ul>${d['知识点'].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <table>
          <tr><th>重难点</th><td>${esc(d['重难点'])}</td></tr>
          <tr><th>易错点</th><td>${esc(d['易错点'])}</td></tr>
          <tr><th>教学建议</th><td>${esc(d['教学建议'])}</td></tr>
        </table>
        <h3>备注与板书</h3>
        <div class="md" data-body="${i}"></div>
      </div>
    </details>`).join('');
  // 正文是渲染好的 HTML，单独注入避免转义与模板字符冲突
  list.querySelectorAll('[data-body]').forEach(el => {
    el.innerHTML = rows[Number(el.dataset.body)]['正文HTML'] || '';
  });
}
document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); book = c.dataset.book; render();
}));
render();
</script>
