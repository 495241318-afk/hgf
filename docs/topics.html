.topic .meta{color:var(--sub);font-size:12px;margin-bottom:8px}
.lead{font-size:14px;background:var(--bg);border-left:3px solid var(--accent);padding:8px 12px;margin:10px 0;border-radius:0 6px 6px 0}
.kw{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:2px 4px 2px 0}

.md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--bg);font-weight:600}
.md ul,.md ol{padding-left:20px;margin:6px 0}
.md p{margin:6px 0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--sub)}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--bg);padding:1px 4px;border-radius:3px}
.lessons{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.lessons summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.lesson{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lesson:last-child{border-bottom:0}
.lesson .err{color:var(--sub);font-size:13px;margin-top:3px}
footer{max-width:960px;margin:24px auto;color:var(--sub);font-size:12px}
@media (max-width:640px){
  body{padding:14px}
  .topic{padding:14px}

}

<script>
const TOPICS = [{"专题": "列强侵略与中国人民的抗争", "适用": "八年级上册", "概述": "1840—1945 年，列强五次大规模侵华，中国从“天朝上国”跌为半殖民地半封建社会，又在全民族抗战中第一次取得反侵略战争的完全胜利。这条线是中考中国近代史的第一主线，考查方式以“条约内容—社会性质变化—抗争结果”的因果链为主。", "关键词": ["鸦片战争", "甲午中日战争", "八国联军", "抗日战争", "不平等条约"], "正文HTML": "<h2>一条主线</h2>\n<p><strong>侵略加深 → 危机加剧 → 抗争升级 → 民族觉醒</strong>。</p>\n<p>四次侵略战争对应四个阶段的沉沦，抗日战争则是这条曲线的转折点：中国从任人宰割走向民族独立。</p>\n<h2>五次侵华战争对照</h2>\n<table>\n<thead>\n<tr>\n<th>时间</th>\n<th>战争</th>\n<th>主要条约</th>\n<th>社会性质的变化</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1840—1842</td>\n<td>鸦片战争</td>\n<td>《南京条约》</td>\n<td>开始沦为半殖民地半封建社会</td>\n</tr>\n<tr>\n<td>1856—1860</td>\n<td>第二次鸦片战争</td>\n<td>《天津条约》《北京条约》</td>\n<td>半殖民地化程度进一步加深</td>\n</tr>\n<tr>\n<td>1894—1895</td>\n<td>甲午中日战争</td>\n<td>《马关条约》</td>\n<td>大大加深，掀起瓜分狂潮</td>\n</tr>\n<tr>\n<td>1900—1901</td>\n<td>八国联军侵华</td>\n<td>《辛丑条约》</td>\n<td>完全沦为半殖民地半封建社会</td>\n</tr>\n<tr>\n<td>1931—1945</td>\n<td>日本侵华战争</td>\n<td>—</td>\n<td>抗战胜利，台湾光复</td>\n</tr>\n</tbody>\n</table>\n<h2>条约的关键差异</h2>\n<ul>\n<li><strong>《南京条约》</strong>：割香港岛、赔 2100 万银元、开五口（广州、厦门、福州、宁波、上海）、协定关税。<strong>第一个不平等条约</strong>。</li>\n<li><strong>《马关条约》</strong>：割辽东半岛、台湾全岛及所有附属岛屿、澎湖列岛，赔 2 亿两，开沙市、重庆、苏州、杭州，允许日本在通商口岸开设工厂——<strong>资本输出</strong>的开始，这是它与前两个条约最本质的不同。</li>\n<li><strong>《辛丑条约》</strong>：赔 4.5 亿两、划东交民巷为使馆界、拆炮台驻兵、严禁人民反帝。<strong>没有割地</strong>，但主权丧失最严重。</li>\n</ul>\n<h2>抗争的两条线</h2>\n<p><strong>民众与下层</strong>：三元里抗英、太平天国（八上第 3 课）、义和团“扶清灭洋”。<br />\n<strong>政府与军队</strong>：左宗棠收复新疆、邓世昌黄海海战、台湾人民反割台、正面战场（淞沪、台儿庄、武汉、长沙）与敌后战场（平型关、百团大战）。</p>\n<blockquote>\n<p>抗战胜利的根本原因是<strong>全民族抗战</strong>，不是外援，也不是单纯靠军队。这一点几乎每年都考。</p>\n</blockquote>\n<h2>常考设问</h2>\n<ol>\n<li>为什么说鸦片战争是中国近代史的开端？（社会性质、主要矛盾、革命任务三重变化）</li>\n<li>列强侵华方式在《马关条约》后有什么变化？（商品输出 → 资本输出）</li>\n<li>抗日战争胜利的意义是什么？（洗雪民族耻辱、台湾回归、世界反法西斯战争的重要组成部分、国际地位提高）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>虎门销烟是导火线，<strong>根本原因</strong>是英国要打开中国市场。</li>\n<li>割让的是<strong>香港岛</strong>，不是整个香港地区（九龙半岛是 1860 年，新界是 1898 年）。</li>\n<li>八国联军侵华的直接原因是镇压义和团，不是“保护使馆”那么简单。</li>\n<li>抗战胜利日是 <strong>1945 年 9 月 2 日</strong>日本签署投降书，9 月 3 日为胜利纪念日；台湾光复是 10 月 25 日。</li>\n</ul>", "课时": [{"册别": "八年级上册", "课序": 1, "课题": "鸦片战争", "易错点": "根本原因是英国要打开中国市场，虎门销烟只是借口和导火线，不能说“虎门销烟导致战争”；割让的是香港岛，不是整个香港；五口通商不含天津；\"半殖民地半封建\"要能分别解释（主权部分丧失、自然经济开始解体）", "知识点": ["背景：英国完成工业革命，急需打开中国市场；正常贸易中中国处于出超地位，英国转而走私鸦片", "鸦片危害：白银大量外流、财政危机、吏治腐败、军队战斗力削弱、损害国人身心健康", "虎门销烟：1839 年 6 月 3 日至 25 日，林则徐在广东虎门海滩当众销毁鸦片 110 多万公斤", "战争经过：1840 年 6 月英国舰队侵入，攻广州、定海，北犯天津大沽；1842 年 8 月清政府战败求和", "《南京条约》内容：割香港岛给英国；赔款 2100 万银元；开放广州、厦门、福州、宁波、上海五处为通商口岸；英商进出口货物应纳税款须与英国协商（协定关税）", "影响：中国开始沦为半殖民地半封建社会，是中国近代史的开端"]}, {"册别": "八年级上册", "课序": 2, "课题": "第二次鸦片战争", "易错点": "火烧圆明园的是英法联军，不是八国联军（八国联军是 1900 年）；沙俄割地最多（150 多万平方千米），但很多人只记得英法；《天津条约》与《北京条约》内容容易混，记住“天津在前、北京在后，天津开十口、北京加天津”", "知识点": ["原因：英法等国不满足既得利益，企图进一步打开中国市场，提出“修约”要求被拒", "经过：1856 年 10 月英法联军发动战争；1858 年攻占天津，迫签《天津条约》；1860 年攻入北京，火烧圆明园，迫签《北京条约》", "《天津条约》：外国公使进驻北京；增开汉口、南京等十处为通商口岸；外国商船和军舰可在长江各口岸自由航行", "《北京条约》：承认《天津条约》继续有效；增开天津为商埠；割九龙司地方一区给英国；赔款额大幅增加", "沙俄侵占：通过《瑷珲条约》《北京条约》《勘分西北界约记》等，共割占中国东北和西北领土 150 多万平方千米", "影响：中国半殖民地化程度进一步加深"]}, {"册别": "八年级上册", "课序": 5, "课题": "甲午中日战争与列强瓜分中国狂潮", "易错点": "赔款是白银 2 亿两，《南京条约》才是 2100 万银元，两个数字极易混；“允许开设工厂”标志列强侵华由商品输出为主转向资本输出为主，这是本科最关键的一句；北洋舰队全军覆没于威海卫战役，不是黄海海战；割让范围包括台湾全岛及所有附属岛屿、澎湖列岛", "知识点": ["背景：日本明治维新后走上对外扩张道路，蓄谋侵略中国", "主要战役：1894 年丰岛海战爆发；平壤战役；黄海海战（邓世昌与致远舰）；日军旅顺大屠杀；威海卫战役，北洋舰队全军覆没", "《马关条约》：1895 年李鸿章与伊藤博文签订，割辽东半岛、台湾全岛及所有附属各岛屿、澎湖列岛给日本；赔款白银 2 亿两；开放沙市、重庆、苏州、杭州为商埠；允许日本在通商口岸开设工厂", "三国干涉还辽：俄、德、法出面干涉，中国付出 3000 万两白银“赎辽费”", "瓜分狂潮：列强强租租借地、划分“势力范围”；1899 年美国提出“门户开放”政策"]}, {"册别": "八年级上册", "课序": 7, "课题": "抗击八国联军", "易错点": "八国联军是 1900 年，火烧圆明园是 1860 年英法联军，两件事不能混；《辛丑条约》赔款 4.5 亿两，不是 2 亿两（《马关条约》才是 2 亿两）；义和团“扶清灭洋”有反帝爱国一面，也有盲目排外一面，评价要两面说；《辛丑条约》没有割地，但危害最重，因为它控制了清政府本身", "知识点": ["义和团兴起：由山东、直隶一带的民间秘密结社发展而来，以农民为主体", "口号：“扶清灭洋”，具有强烈的反帝爱国性质，但也带有盲目排外色彩", "1900 年 6 月，英、美、俄、日、法、德、意、奥八国组织联军，由天津向北京进犯", "义和团在廊坊一带阻击联军，清军与义和团围攻西什库教堂和东交民巷使馆区", "1900 年 8 月，八国联军攻陷北京，慈禧太后携光绪帝西逃，下令剿杀义和团", "《辛丑条约》（1901 年）：赔款白银 4.5 亿两，分 39 年还清，本息共约 9.8 亿两；清政府保证严禁人民参加反帝活动；拆毁大沽炮台，允许外国军队驻扎北京到山海关铁路沿线要地；划定北京东交民巷为使馆界，允许各国驻兵，不准中国人居住；改总理衙门为外务部", "影响：中国完全陷入半殖民地半封建社会的深渊"]}, {"册别": "八年级上册", "课序": 18, "课题": "从九一八事变到西安事变", "易错点": "九一八事变是 1931 年，七七事变是 1937 年，前者是局部抗战开始，后者是全民族抗战开始；西安事变扣押蒋介石的是张学良、杨虎城，不是共产党；西安事变和平解决后抗日民族统一战线“初步形成”，正式建立是 1937 年 9 月国民党公布国共合作宣言；伪满洲国成立于 1932 年，溥仪是傀儡", "知识点": ["1931 年 9 月 18 日，日本关东军炸毁沈阳柳条湖附近南满铁路路轨，反诬中国军队所为，进攻东北军驻地北大营，制造九一八事变", "由于蒋介石的不抵抗政策，东北三省全部沦陷；1932 年日本扶植溥仪建立伪满洲国", "东北民众和未撤走的部队组织抗日义勇军；中国共产党派杨靖宇等在东北组织游击队，开展抗日游击战争——中国人民的局部抗战开始", "1935 年，日本策动“华北自治运动”，华北危机加深", "1935 年 12 月 9 日，北平学生发动一二·九运动，揭露日本侵略阴谋，促进抗日救亡运动新高潮", "1936 年 12 月 12 日，张学良、杨虎城在西安扣押蒋介石，实行“兵谏”，要求停止内战、联共抗日，史称西安事变", "中国共产党从全民族利益出发，主张和平解决，派周恩来赴西安谈判", "西安事变和平解决，标志着十年内战基本结束，抗日民族统一战线初步形成"]}, {"册别": "八年级上册", "课序": 19, "课题": "七七事变与全民族抗战", "易错点": "九一八事变是局部抗战开始（1931），七七事变是全民族抗战开始（1937），这是最常考的区分；抗日民族统一战线正式建立是 1937 年 9 月，不是西安事变（那是初步形成）；南京大屠杀遇难同胞 30 万人以上，时间长达六周；淞沪会战是 1937 年 8 月，上海失陷在 11 月", "知识点": ["1937 年 7 月 7 日，日军在北平西南卢沟桥附近演习，借口士兵失踪要求进入宛平城搜查，遭拒后炮轰宛平城，制造七七事变（卢沟桥事变）", "中国守军第二十九军奋起抵抗，佟麟阁、赵登禹殉国", "七七事变标志着中国全民族抗战的开始", "1937 年 8 月 13 日，日军进攻上海，淞沪会战爆发；中国军队坚守三个月，姚子青营、谢晋元部四行仓库保卫战；11 月上海失陷", "1937 年 9 月，国民党公布中共中央提交的国共合作宣言，抗日民族统一战线正式建立", "1937 年 12 月 13 日，日军攻陷南京，进行了长达六周的大屠杀，杀害中国军民 30 万人以上", "南京大屠杀是日本侵略者对中国人民犯下的滔天罪行，铁证如山"]}, {"册别": "八年级上册", "课序": 20, "课题": "正面战场的抗战", "易错点": "台儿庄战役是李宗仁指挥，不是蒋介石亲自指挥；武汉会战标志抗战进入相持阶段，不是相持阶段结束；正面战场与敌后战场是相互配合的关系，不能对立评价；中国远征军入缅是 1942 年，属于世界反法西斯战争的一部分", "知识点": ["淞沪会战后，国民政府迁往重庆，作为陪都", "1938 年 3 月，第五战区司令长官李宗仁指挥台儿庄战役，歼敌一万余人，是抗战以来正面战场取得的最大一场胜仗", "1938 年 6 月至 10 月，武汉会战，历时四个多月，是抗日战争进入相持阶段的标志；广州、武汉失陷后，抗战进入战略相持阶段", "1941 年 12 月至 1942 年 1 月，第三次长沙会战，中国军队重创日军，在国内外产生积极影响", "1942 年，中国远征军入缅甸作战，解救被围英军，仁安羌战役；戴安澜殉国", "正面战场的抗战，消耗了日军大量有生力量，粉碎了日本速战速决的企图，为抗战胜利作出重要贡献"]}, {"册别": "八年级上册", "课序": 21, "课题": "敌后战场的抗战", "易错点": "平型关大捷是抗战以来中国军队的第一个胜利，不是“最大胜利”（最大规模主动出击是百团大战）；百团大战是 1940 年，彭德怀指挥，参战 105 个团；平型关是八路军第一一五师打的，属于配合正面战场的战役，但发生在敌后战场范畴；敌后战场不是“不打大仗”，百团大战就是大规模主动进攻", "知识点": ["1937 年 9 月，八路军第一一五师在平型关伏击日军，歼敌一千多人，是抗战以来中国军队取得的第一个胜利，粉碎了日军“不可战胜”的神话", "八路军、新四军深入敌后，建立抗日根据地，开展游击战争", "陕甘宁边区是敌后战场的战略总后方，延安是中共中央所在地", "1940 年下半年，彭德怀指挥八路军在华北发动百团大战，破坏交通线、拔除据点，参战兵力达 105 个团", "百团大战是抗战期间中国军队主动出击日军的最大规模战役，有力打击了日军的侵略气焰，提高了共产党和八路军的威望", "敌后战场的斗争形式：地道战、地雷战、麻雀战、破袭战等", "作用：牵制了大量日军，配合正面战场，成为抗战的重要战场"]}, {"册别": "八年级上册", "课序": 22, "课题": "抗日战争的胜利", "易错点": "日本宣布无条件投降是 1945 年 8 月 15 日，正式签署投降书是 9 月 2 日，两个时间不同；中共七大在延安召开（1945.4），不是重庆；毛泽东思想在七大被确立为党的指导思想，不是在此之前；抗战是十四年（1931—1945），不是八年（全面抗战是八年）", "知识点": ["1945 年 4 月至 6 月，中共七大在延安召开", "七大内容：制定了党的政治路线，即放手发动群众，壮大人民力量，在中国共产党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国；确立毛泽东思想为党的指导思想并写入党章", "七大意义：为争取抗日战争的最后胜利准备了条件，为中国共产党和中国人民指明了战后的奋斗方向", "1945 年 8 月，美国向广岛、长崎投下原子弹，苏联对日宣战并出兵中国东北，中国军队展开大反攻", "1945 年 8 月 15 日，日本天皇宣布无条件投降；9 月 2 日，日本政府正式签署投降书；9 月 3 日成为中国抗战胜利纪念日", "1945 年 10 月 25 日，台湾光复，回到祖国怀抱", "抗战胜利的意义：是中国近代以来抗击外敌入侵第一次取得完全胜利的民族解放战争；洗雪了近代以来的民族耻辱；中国的国际地位得到提高；是世界反法西斯战争的重要组成部分", "胜利原因：中国共产党发挥中流砥柱作用；全民族抗战；世界反法西斯力量的配合"]}]}, {"专题": "近代化的探索", "适用": "八年级上册", "概述": "从“师夷长技”到“变法图强”，再到“民主共和”与“民主科学”，中国人向西方学习的层次由器物到制度再到思想，一次比一次深入，也一次比一次触及根本。这条线与“列强侵略”互为因果，是材料题的高频命题区。", "关键词": ["洋务运动", "戊戌变法", "辛亥革命", "新文化运动", "器物与制度"], "正文HTML": "<h2>一条主线：学什么，为什么失败</h2>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>事件</th>\n<th>学的是什么</th>\n<th>领导阶级</th>\n<th>结果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>器物</td>\n<td>洋务运动（1861—1895）</td>\n<td>军事与民用技术</td>\n<td>地主阶级洋务派</td>\n<td>甲午战败，宣告破产</td>\n</tr>\n<tr>\n<td>制度（改良）</td>\n<td>戊戌变法（1898）</td>\n<td>君主立宪</td>\n<td>资产阶级维新派</td>\n<td>戊戌政变，103 天失败</td>\n</tr>\n<tr>\n<td>制度（革命）</td>\n<td>辛亥革命（1911）</td>\n<td>民主共和</td>\n<td>资产阶级革命派</td>\n<td>推翻帝制，未改变社会性质</td>\n</tr>\n<tr>\n<td>思想</td>\n<td>新文化运动（1915 起）</td>\n<td>民主与科学</td>\n<td>激进民主主义者</td>\n<td>动摇封建礼教，为五四奠基</td>\n</tr>\n</tbody>\n</table>\n<h2>每个阶段的“标志性一句话”</h2>\n<ul>\n<li><strong>洋务运动</strong>：中国近代化的<strong>开端</strong>，但不是近代史的开端（那是鸦片战争）。</li>\n<li><strong>戊戌变法</strong>：中国政治近代化的<strong>起点</strong>，第一次提出君主立宪的方案。</li>\n<li><strong>辛亥革命</strong>：<strong>结束了两千多年的君主专制制度</strong>，但反帝反封建的任务没有完成。</li>\n<li><strong>新文化运动</strong>：中国近代史上一次<strong>空前的思想大解放</strong>，“民主”“科学”两面大旗。</li>\n</ul>\n<h2>四次探索的共同点</h2>\n<p>都发生在民族危机加深的背景下，都由有识之士主动求变，都主张向西方学习，都因<strong>没有改变半殖民地半封建的社会性质</strong>而未能成功。</p>\n<blockquote>\n<p>材料题常问：为什么这些探索都失败了？标准答法是两层——阶级局限性（地主阶级维护统治、资产阶级力量弱小且脱离群众）加外部压制（列强不允许中国真正强大）。</p>\n</blockquote>\n<h2>两个易混的“开端”</h2>\n<table>\n<thead>\n<tr>\n<th>说法</th>\n<th>对应事件</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>中国近代史的开端</td>\n<td>鸦片战争（1840）</td>\n</tr>\n<tr>\n<td>中国近代化的开端</td>\n<td>洋务运动（19 世纪 60 年代）</td>\n</tr>\n<tr>\n<td>中国新民主主义革命的开端</td>\n<td>五四运动（1919）</td>\n</tr>\n<tr>\n<td>中国政治近代化的起点</td>\n<td>戊戌变法（1898）</td>\n</tr>\n</tbody>\n</table>\n<h2>常考设问</h2>\n<ol>\n<li>从洋务运动到新文化运动，中国人向西方学习经历了怎样的变化？（器物 → 制度 → 思想文化，层层深入）</li>\n<li>辛亥革命为什么“成功了又失败了”？（成功在推翻帝制、建立共和；失败在没有改变社会性质、没有完成反帝反封建任务）</li>\n<li>新文化运动与五四运动是什么关系？（前者是思想准备，后者是政治实践；前者提倡白话文，直接推动了后者的群众动员）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>洋务运动是<strong>地主阶级的自救运动</strong>，不是资产阶级改革。办企业是为维护清朝统治，不是发展资本主义。</li>\n<li>京师同文馆（1862，洋务运动）与京师大学堂（1898，戊戌变法）不是同一所学校。</li>\n<li>辛亥革命推翻的是<strong>君主专制制度</strong>，不是封建制度——封建土地制度和封建思想依然存在。</li>\n<li>新文化运动前期宣传民主科学，后期（十月革命后）开始宣传马克思主义，两个阶段要分开说。</li>\n</ul>", "课时": [{"册别": "八年级上册", "课序": 4, "课题": "洋务运动", "易错点": "洋务运动是地主阶级的自救运动，不是资产阶级改革（戊戌变法才是）；京师同文馆是洋务运动中创办的，不是戊戌变法时的京师大学堂；北洋舰队全军覆没于甲午战争，标志洋务运动破产，不是鸦片战争；洋务派办企业是为了维护清朝统治，不是发展资本主义", "知识点": ["时间：19 世纪 60 年代到 90 年代中期", "目的：利用西方先进技术，强兵富国，维护清王朝统治", "代表：中央以奕䜣为代表，地方以曾国藩、李鸿章、左宗棠、张之洞为代表", "口号：前期“自强”，后期“求富”", "军事工业：安庆内军械所、江南机器制造总局、福州船政局", "民用企业：轮船招商局、开平煤矿、汉阳铁厂、湖北织布局", "教育：创办京师同文馆等新式学堂，派遣留学生出国深造", "军事：组建北洋、南洋、福建三支海军", "结局：甲午中日战争中国战败，标志洋务运动破产", "评价：中国历史上第一次近代化运动；客观上促进了中国民族资本主义的产生；但只学技术不改制度，未能使中国富强"]}, {"册别": "八年级上册", "课序": 6, "课题": "戊戌变法", "易错点": "公车上书是“上书”，不是武装起义；百日维新共 103 天，从 1898 年 6 月 11 日到 9 月 21 日；京师大学堂是戊戌变法中创办的（1898），京师同文馆是洋务运动时办的（1862），两者不能混；戊戌变法要建立君主立宪制，不是共和制（共和是辛亥革命）", "知识点": ["序幕：1895 年《马关条约》签订消息传来，康有为、梁启超联合各省举人上书光绪帝，史称“公车上书”", "宣传：创办《时务报》《国闻报》，梁启超发表《变法通议》，宣扬“变法图强”", "高潮：1898 年 6 月 11 日，光绪帝颁布“明定国是”诏书，变法开始，史称“百日维新”", "内容：裁撤冗官冗员，允许官民上书言事；鼓励私人兴办工矿企业，发展农工商业；开办新式学堂（京师大学堂），传播新思想；训练新式军队", "失败：以慈禧太后为首的顽固派发动政变，囚禁光绪帝，谭嗣同等“戊戌六君子”被杀", "意义：在思想文化方面产生了广泛而持久的影响，起到思想启蒙作用", "局限：依靠无实权的皇帝，脱离群众，顽固派势力强大"]}, {"册别": "八年级上册", "课序": 9, "课题": "辛亥革命", "易错点": "武昌起义是 1911 年 10 月 10 日，中华民国成立是 1912 年 1 月 1 日，两个时间不能混；辛亥革命推翻的是君主专制制度（帝制），不是封建制度（封建土地制度、封建思想仍然存在）；辛亥革命没有改变半殖民地半封建社会性质，这是最常考也最易错的评价点", "知识点": ["背景：同盟会成立后，革命党人发动多次武装起义；四川保路运动使湖北新军入川，武汉兵力空虚", "1911 年 10 月 10 日，武昌城内新军工程营士兵起义，攻占楚望台军械库，次日占领武昌，随后武汉三镇光复", "起义胜利后成立湖北军政府，推黎元洪为都督", "各省纷纷响应，一个多月内十几个省宣布独立", "1912 年 1 月 1 日，孙中山在南京就任临时大总统，中华民国临时政府成立", "意义：推翻了清王朝的反动统治，宣告了中国两千多年君主专制制度的终结；开创了完全意义上的近代民族民主革命，极大推动了中华民族的思想解放", "局限：没有改变中国半殖民地半封建的社会性质，没有完成反帝反封建的任务"]}, {"册别": "八年级上册", "课序": 11, "课题": "北洋政府的统治与军阀割据", "易错点": "二次革命是 1913 年讨袁，护国战争是 1915 年讨袁，两次不是一回事；袁世凯是“接受二十一条大部分内容”，不是全部接受；袁世凯 1916 年被迫取消帝制后病死，帝制仅维持 83 天；军阀割据的根源是半殖民地半封建的社会性质，不是某个人物造成的", "知识点": ["1913 年，宋教仁改组国民党，准备组织内阁，在上海遇刺身亡，史称“宋案”", "孙中山、黄兴发动二次革命，因力量涣散失败", "袁世凯解散国民党和国会，改责任内阁制为总统制，修改总统选举法，规定总统可无限期连任", "1915 年，袁世凯接受日本“二十一条”的大部分内容，以换取日本支持", "1915 年底，袁世凯称帝，改中华民国为中华帝国，年号洪宪", "蔡锷、李烈钧、唐继尧在云南宣告独立，组织护国军讨袁，护国战争爆发", "1916 年 3 月，袁世凯被迫取消帝制，6 月病死", "此后军阀割据混战：直系（冯国璋、曹锟）、皖系（段祺瑞）、奉系（张作霖）、滇系（唐继尧）、桂系（陆荣廷）等", "影响：军阀混战给人民带来深重灾难，国家陷入分裂动乱"]}, {"册别": "八年级上册", "课序": 12, "课题": "新文化运动", "易错点": "兴起标志是 1915 年创办《青年杂志》，改名《新青年》是次年的事；民主与科学对应“德先生”“赛先生”，不要与“自强”“求富”混；新文化运动性质是思想解放运动，不是政治运动或革命运动；评价必须辩证，既要讲解放作用，也要讲绝对化偏向", "知识点": ["背景：辛亥革命后民主共和观念传播，但北洋军阀掀起尊孔复古逆流", "兴起标志：1915 年陈独秀在上海创办《青年杂志》，第二年改名《新青年》", "代表人物：陈独秀、胡适、李大钊、鲁迅", "主要阵地：《新青年》和北京大学", "内容之一：抨击旧道德和旧文化，鲁迅《狂人日记》以白话文揭露封建礼教", "内容之二：提倡民主与科学，即“德先生”和“赛先生”", "内容之三：文学革命，胡适《文学改良刍议》主张白话文，陈独秀《文学革命论》", "影响：动摇了封建道德礼教的统治地位，促进思想解放，为五四运动作了思想准备", "局限：对东西方文化的看法存在绝对肯定或绝对否定的偏向"]}, {"册别": "八年级上册", "课序": 13, "课题": "五四运动", "易错点": "五四运动的导火线是巴黎和会中国外交失败，不是“二十一条”；6 月 5 日后运动中心转到上海，主力由学生变为工人，这个转变是理解“新民主主义”的关键；五四运动是彻底反帝反封建，但当时并未完成反帝反封建任务；“新民主主义”之“新”，在于领导阶级是无产阶级", "知识点": ["导火线：1919 年巴黎和会上中国外交失败，列强将德国在山东的特权转让给日本", "1919 年 5 月 4 日，北京三千多名学生在天安门集会游行，提出“外争主权，内除国贼”“取消二十一条”“还我青岛”“拒绝在和约上签字”等口号", "学生火烧赵家楼，北洋政府逮捕学生，激起全国各界声援", "6 月 5 日，上海工人罢工、商人罢市，运动中心由北京转移到上海，工人阶级成为运动主力", "结果：北洋政府释放被捕学生，罢免曹汝霖等人职务，中国代表拒绝在《凡尔赛条约》上签字", "性质：一场以青年学生为先锋、广大人民参加的彻底反帝反封建的伟大爱国革命运动", "意义：是中国旧民主主义革命走向新民主主义革命的转折点，工人阶级登上政治舞台，促进了马克思主义的传播"]}, {"册别": "八年级上册", "课序": 25, "课题": "经济和社会生活的变化", "易错点": "张謇是清末状元，主张“实业救国”，不是资产阶级革命派；民族工业“短暂的春天”出现在一战期间，不是甲午战后；民族工业始终没有成为中国社会经济的主体；社会生活的变化只在城市和沿海较明显，广大农村变化很小", "知识点": ["产生：19 世纪六七十年代，中国民族资本主义产生", "初步发展：甲午中日战争后，清政府放宽民间设厂限制，民族工业初步发展", "短暂春天：一战期间，欧洲列强忙于战争，暂时放松对华经济侵略，民族工业出现“短暂的春天”", "再度受挫：一战后欧洲列强卷土重来，民族工业受挫；抗战时期和内战时期日益萎缩", "特点：总体比较落后，主要集中在轻工业部门，地区分布不平衡，集中于上海、武汉等沿海沿江大城市", "张謇：清末状元，主张“实业救国”，创办大生纱厂等企业，后因外国资本挤压等原因破产", "社会生活变化：剪辫、易服、劝禁缠足；废除跪拜礼，改称“先生”“君”；装订、照相、电影等传入", "变化特点：呈现出新旧并呈、多元发展的特征；沿海地区变化大，内地和农村变化小"]}, {"册别": "八年级上册", "课序": 26, "课题": "教育文化事业的发展", "易错点": "京师大学堂是 1898 年戊戌变法时创办的，京师同文馆是洋务运动时创办的（1862），两者不能混；废除科举是 1905 年，不是戊戌变法时期；《申报》是报纸，商务印书馆是出版机构，不要混；《义勇军进行曲》是聂耳作曲、田汉作词", "知识点": ["洋务运动时期创办京师同文馆等新式学堂；1898 年戊戌变法期间创办京师大学堂，是中国近代第一所国家建立的最高学府", "1905 年，清政府废除科举制度，存在约 1300 年的科举制退出历史舞台", "报纸：《申报》1872 年创办于上海，是近代中国存在时间最长、影响最大的中文报纸；《新青年》等刊物传播新思想", "出版：1897 年创办于上海的商务印书馆，是近代中国规模最大的文化出版机构", "文学：鲁迅《狂人日记》《阿 Q 正传》，茅盾《子夜》，巴金《家》，老舍《骆驼祥子》", "艺术：聂耳作曲《义勇军进行曲》，冼星海《黄河大合唱》；徐悲鸿《愚公移山》，齐白石擅长花鸟虫鱼；电影《定军山》是中国人拍摄的第一部无声电影", "特点：教育、新闻、出版、文艺都带有救亡图存的时代印记"]}]}, {"专题": "中国共产党领导的革命历程", "适用": "八年级上册（兼八年级下册第1课）", "概述": "从 1919 年五四运动到 1949 年中华人民共和国成立，三十年间中国共产党从 50 多名党员发展为执政党。这条线的考查重点是“转折”——每一次危机之后的方向调整，尤其是井冈山道路与遵义会议。", "关键词": ["五四运动", "中共一大", "井冈山", "长征", "全民族抗战"], "正文HTML": "<h2>一条主线：三次转折</h2>\n<table>\n<thead>\n<tr>\n<th>转折</th>\n<th>时间</th>\n<th>从什么到什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>井冈山道路</td>\n<td>1927</td>\n<td>城市暴动 → 农村包围城市、武装夺取政权</td>\n</tr>\n<tr>\n<td>遵义会议</td>\n<td>1935.1</td>\n<td>王明“左”倾错误领导 → 以毛泽东为核心的正确领导</td>\n</tr>\n<tr>\n<td>七届二中全会</td>\n<td>1949.3</td>\n<td>乡村 → 城市，革命 → 建设</td>\n</tr>\n</tbody>\n</table>\n<h2>时间轴</h2>\n<ul>\n<li><strong>1919</strong> 五四运动，新民主主义革命开端，工人阶级登上政治舞台</li>\n<li><strong>1921</strong> 中共一大，上海（后转嘉兴南湖），中国共产党诞生</li>\n<li><strong>1924—1927</strong> 国共第一次合作，北伐战争，基本推翻北洋军阀统治</li>\n<li><strong>1927</strong> 南昌起义（8.1）、八七会议、秋收起义、井冈山革命根据地</li>\n<li><strong>1934.10—1936.10</strong> 红军长征，遵义会议是生死攸关的转折点</li>\n<li><strong>1937—1945</strong> 全民族抗战，中共发挥<strong>中流砥柱</strong>作用</li>\n<li><strong>1946—1949</strong> 解放战争，三大战役、渡江战役</li>\n<li><strong>1949.10.1</strong> 开国大典</li>\n</ul>\n<h2>为什么是“农村包围城市”</h2>\n<p>中国是农业大国，农民占人口绝大多数；城市中敌人力量强大；农村敌人统治薄弱。这三个条件决定了照搬俄国“城市中心”道路走不通。<strong>这是马克思主义与中国实际相结合的第一次历史性飞跃</strong>。</p>\n<h2>抗战中的中共</h2>\n<ul>\n<li>政治上：倡导并推动抗日民族统一战线</li>\n<li>军事上：平型关大捷（首次大捷）、百团大战（主动出击规模最大）</li>\n<li>理论上：《论持久战》指出抗战三阶段</li>\n<li>战略上：敌后战场与正面战场相互配合，后期成为主战场</li>\n</ul>\n<h2>常考设问</h2>\n<ol>\n<li>为什么说遵义会议是“生死攸关的转折点”？（纠正军事与组织上的“左”倾错误，确立毛泽东的领导地位，挽救了党、红军和中国革命）</li>\n<li>中国共产党在抗战中发挥了什么作用？（倡导统一战线、开辟敌后战场、提出持久战，起到中流砥柱作用）</li>\n<li>解放战争迅速胜利的原因？（中共正确领导、土地改革赢得民心、人民军队英勇作战、国民党政治腐败经济崩溃）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>中共一大是 <strong>1921 年 7 月</strong>，上海法租界望志路，最后一天转到嘉兴南湖游船。</li>\n<li>南昌起义是<strong>打响武装反抗国民党反动统治第一枪</strong>，不是建立根据地。</li>\n<li>长征结束是 <strong>1936 年 10 月</strong>三大主力在甘肃会宁会师，不是 1935 年到达陕北。</li>\n<li>抗战胜利后重庆谈判签订的是《双十协定》，<strong>不是和平建国纲领的落实</strong>；内战全面爆发的标志是 1946 年 6 月国民党进攻中原解放区。</li>\n</ul>", "课时": [{"册别": "八年级上册", "课序": 13, "课题": "五四运动", "易错点": "五四运动的导火线是巴黎和会中国外交失败，不是“二十一条”；6 月 5 日后运动中心转到上海，主力由学生变为工人，这个转变是理解“新民主主义”的关键；五四运动是彻底反帝反封建，但当时并未完成反帝反封建任务；“新民主主义”之“新”，在于领导阶级是无产阶级", "知识点": ["导火线：1919 年巴黎和会上中国外交失败，列强将德国在山东的特权转让给日本", "1919 年 5 月 4 日，北京三千多名学生在天安门集会游行，提出“外争主权，内除国贼”“取消二十一条”“还我青岛”“拒绝在和约上签字”等口号", "学生火烧赵家楼，北洋政府逮捕学生，激起全国各界声援", "6 月 5 日，上海工人罢工、商人罢市，运动中心由北京转移到上海，工人阶级成为运动主力", "结果：北洋政府释放被捕学生，罢免曹汝霖等人职务，中国代表拒绝在《凡尔赛条约》上签字", "性质：一场以青年学生为先锋、广大人民参加的彻底反帝反封建的伟大爱国革命运动", "意义：是中国旧民主主义革命走向新民主主义革命的转折点，工人阶级登上政治舞台，促进了马克思主义的传播"]}, {"册别": "八年级上册", "课序": 14, "课题": "中国共产党诞生", "易错点": "中共一大是 1921 年 7 月，先在上海、后转嘉兴南湖，不是一开头就在南湖；一大代表 13 人，代表 50 多名党员，不是全体；陈独秀被选为中央局书记，但他当时未出席会议；中共二大才提出民主革命纲领，一大提的是最高纲领（共产主义）", "知识点": ["思想基础：李大钊发表《庶民的胜利》《布尔什维主义的胜利》，发表《我的马克思主义观》，系统介绍马克思主义", "组织基础：1920 年起，陈独秀、李大钊等在上海、北京等地建立共产党早期组织", "阶级基础：五四运动后工人阶级登上政治舞台，工人运动发展", "1921 年 7 月，中共一大在上海秘密召开，后转至浙江嘉兴南湖的游船上继续，出席代表 13 人，代表全国 50 多名党员", "一大内容：通过党的第一个纲领，确定党的名称为“中国共产党”，明确党的奋斗目标是推翻资产阶级政权、建立无产阶级专政、实现共产主义；确定党成立后的中心任务是领导和组织工人运动；选举陈独秀为中央局书记", "1922 年，中共二大在上海召开，第一次提出彻底的反帝反封建的民主革命纲领", "意义：中国共产党的诞生，是中国历史上开天辟地的大事，中国革命的面貌焕然一新"]}, {"册别": "八年级上册", "课序": 15, "课题": "北伐战争", "易错点": "黄埔军校是 1924 年国共合作后创办的，不是国民党单独办的；北伐的主要对象是吴佩孚、孙传芳、张作霖三派军阀，不是日本侵略者；北伐军胜利进军不等于国民革命成功，1927 年因政变而失败；南京国民政府成立于 1927 年 4 月，与 1927 年 7 月汪精卫政变不是同一件事", "知识点": ["1924 年 1 月，国民党一大在广州召开，标志着国共第一次合作正式建立", "1924 年 5 月，黄埔军校在广州创办，孙中山任总理，蒋介石任校长，周恩来任政治部主任", "1926 年，国民革命军誓师北伐，目标是推翻吴佩孚、孙传芳、张作霖三派军阀", "主战场：湖南、湖北。叶挺率领的第四军独立团在汀泗桥、贺胜桥战役中屡建战功，赢得“铁军”称号", "北伐军不到半年，从珠江流域打到长江流域，1927 年国民政府由广州迁往武汉", "1927 年 4 月 12 日，蒋介石在上海发动反革命政变；7 月，汪精卫在武汉发动反革命政变，国共合作破裂，国民革命失败", "1927 年 4 月，蒋介石在南京成立国民政府，后统一全国，代表大地主大资产阶级利益"]}, {"册别": "八年级上册", "课序": 16, "课题": "毛泽东开辟井冈山道路", "易错点": "南昌起义是打响第一枪，但起义部队后来南下受挫，不是直接上了井冈山；井冈山革命根据地是第一个农村革命根据地，不是第一个革命根据地（此前有城市根据地性质的尝试）；八七会议在汉口召开，不在上海；三湾改编确立的是党对军队的绝对领导，不是“支部建在连上”这一条单独内容", "知识点": ["1927 年 8 月 1 日，周恩来、贺龙、朱德、叶挺等领导南昌起义，打响武装反抗国民党反动统治的第一枪", "1927 年 8 月 7 日，中共中央在汉口召开紧急会议（八七会议），确定实行土地革命和武装反抗国民党反动统治的总方针，毛泽东提出“政权是由枪杆子中取得的”", "1927 年 9 月，毛泽东领导湘赣边界秋收起义，进攻长沙受挫后，改向敌人力量薄弱的农村进军", "三湾改编，确立党对军队的绝对领导", "1927 年 10 月，创建井冈山革命根据地——中国第一个农村革命根据地", "1928 年 4 月，朱德、陈毅率部与毛泽东在井冈山会师，成立中国工农红军第四军", "毛泽东提出“工农武装割据”思想：武装斗争、土地革命、根据地建设相结合", "意义：开辟了一条农村包围城市、武装夺取政权的革命道路"]}, {"册别": "八年级上册", "课序": 17, "课题": "中国工农红军长征", "易错点": "遵义会议是 1935 年 1 月，长征开始是 1934 年 10 月，不能颠倒；遵义会议确立的是以毛泽东为核心的党中央的正确领导，当时并未立即取代全部军事指挥；长征结束是 1936 年 10 月三大主力会宁会师，不是 1935 年吴起镇到达陕北；长征是被迫战略转移，不是主动出击", "知识点": ["原因：博古、李德等人“左”倾错误指挥，第五次反“围剿”失利，红军被迫战略转移", "1934 年 10 月，中央红军从江西瑞金出发，开始长征", "初期突破四道封锁线，湘江战役损失惨重", "1935 年 1 月，遵义会议召开，确立了以毛泽东为核心的党中央的正确领导，是党的历史上生死攸关的转折点", "四渡赤水，打乱敌人追剿计划；巧渡金沙江，跳出包围圈；强渡大渡河、飞夺泸定桥；爬雪山、过草地", "1935 年 10 月，中央红军到达陕北吴起镇", "1936 年 10 月，红二、红四方面军与红一方面军在甘肃会宁会师，长征胜利结束", "意义：粉碎了国民党反动派消灭红军的企图，保存了党和红军的基干力量，使中国革命转危为安；长征播下革命种子，铸就长征精神"]}, {"册别": "八年级上册", "课序": 22, "课题": "抗日战争的胜利", "易错点": "日本宣布无条件投降是 1945 年 8 月 15 日，正式签署投降书是 9 月 2 日，两个时间不同；中共七大在延安召开（1945.4），不是重庆；毛泽东思想在七大被确立为党的指导思想，不是在此之前；抗战是十四年（1931—1945），不是八年（全面抗战是八年）", "知识点": ["1945 年 4 月至 6 月，中共七大在延安召开", "七大内容：制定了党的政治路线，即放手发动群众，壮大人民力量，在中国共产党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国；确立毛泽东思想为党的指导思想并写入党章", "七大意义：为争取抗日战争的最后胜利准备了条件，为中国共产党和中国人民指明了战后的奋斗方向", "1945 年 8 月，美国向广岛、长崎投下原子弹，苏联对日宣战并出兵中国东北，中国军队展开大反攻", "1945 年 8 月 15 日，日本天皇宣布无条件投降；9 月 2 日，日本政府正式签署投降书；9 月 3 日成为中国抗战胜利纪念日", "1945 年 10 月 25 日，台湾光复，回到祖国怀抱", "抗战胜利的意义：是中国近代以来抗击外敌入侵第一次取得完全胜利的民族解放战争；洗雪了近代以来的民族耻辱；中国的国际地位得到提高；是世界反法西斯战争的重要组成部分", "胜利原因：中国共产党发挥中流砥柱作用；全民族抗战；世界反法西斯力量的配合"]}, {"册别": "八年级上册", "课序": 23, "课题": "内战爆发", "易错点": "双十协定是 1945 年 10 月 10 日签署，全面内战爆发是 1946 年 6 月，中间还有政治协商会议；全面内战爆发的标志是国民党进攻中原解放区；中共中央撤离延安是主动转移，不是战败溃退；运动战方针的核心是“消灭敌人有生力量”，不是“保守地方”", "知识点": ["抗战胜利后，中国面临两种前途、两种命运的抉择", "1945 年 8 月，蒋介石三次电邀毛泽东到重庆商谈国内和平问题；毛泽东不顾个人安危赴重庆，同国民党谈判", "1945 年 10 月 10 日，国共双方签署《政府与中共代表会谈纪要》，即“双十协定”，确定和平建国的基本方针", "1946 年 1 月，政治协商会议在重庆召开", "1946 年 6 月，蒋介石撕毁协定，以进攻中原解放区为起点，发动全面内战", "人民解放军采取“运动战”方针，以歼灭敌人有生力量为主要目标，不以保守或夺取地方为主要目标", "1947 年 3 月，国民党军队重点进攻陕甘宁解放区和山东解放区；中共中央主动撤离延安，毛泽东、周恩来等转战陕北", "彭德怀、贺龙率西北野战军取得青化砭、沙家店等战役胜利；华东野战军在孟良崮战役中全歼国民党整编第七十四师"]}, {"册别": "八年级上册", "课序": 24, "课题": "人民解放战争的胜利", "易错点": "挺进大别山是战略进攻的开始，不是战略决战；三大战役是战略决战，顺序是辽沈、淮海、平津（淮海与平津有重叠，但辽沈最先）；南京解放是 1949 年 4 月 23 日，新中国成立是 1949 年 10 月 1 日；淮海战役的中心是徐州，不是南京", "知识点": ["1947 年，中国共产党颁布《中国土地法大纲》，规定没收地主土地，废除封建剥削的土地制度，实行耕者有其田，按照农村人口平均分配土地", "土地改革使解放区一亿多农民分到土地，激起农民革命和生产积极性，为解放战争胜利提供了重要保障", "1947 年夏，刘伯承、邓小平率晋冀鲁豫解放军主力挺进大别山，揭开人民解放军战略进攻的序幕", "1948 年 9 月至 1949 年 1 月，三大战役：辽沈战役（1948.9—11，解放东北全境）、淮海战役（1948.11—1949.1，奠定长江以北解放基础）、平津战役（1948.11—1949.1，北平和平解放）", "三大战役共歼灭和改编国民党军队 150 多万人，国民党军队主力基本被消灭", "1949 年 4 月，渡江战役，人民解放军占领南京，统治中国 22 年的国民党政权覆灭", "胜利原因：中国共产党的正确领导；人民群众的支持；人民解放军的英勇作战；土地改革调动农民积极性"]}, {"册别": "八年级下册", "课序": 1, "课题": "中华人民共和国成立", "易错点": "《共同纲领》起临时宪法作用，不是正式宪法，第一部宪法是 1954 年；西藏和平解放标志“祖国大陆获得统一”，表述要准确，不要写成“全国统一”；一届政协代行全国人大职权，1954 年人大召开后政协转为统一战线组织", "知识点": ["第一届政协：1949 年 9 月在北平召开，通过《共同纲领》，起临时宪法作用；确定国旗、国歌、国都、纪年；选举毛泽东为中央人民政府主席", "开国大典：1949 年 10 月 1 日，天安门广场，宣告中华人民共和国中央人民政府成立", "西藏和平解放：1951 年，西藏地方政府派代表到北京谈判并签订协议，标志祖国大陆获得统一", "国内意义：开辟了中国历史新纪元，中国人民从此站起来了，成为国家的主人", "国际意义：壮大了世界和平民主和社会主义的力量"]}]}, {"专题": "中华人民共和国的成立与社会主义建设", "适用": "八年级下册", "概述": "1949 年之后的中国，主线是“建立—巩固—探索—转折—改革”。中考考查集中在两个节点：1956 年社会主义制度建立，1978 年十一届三中全会。前面是“怎么建成”，后面是“怎么走对”。", "关键词": ["开国大典", "土地改革", "一五计划", "三大改造", "改革开放"], "正文HTML": "<h2>一条主线：四个阶段</h2>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>时间</th>\n<th>关键词</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>成立与巩固</td>\n<td>1949—1952</td>\n<td>开国大典、抗美援朝、土地改革</td>\n</tr>\n<tr>\n<td>制度建立</td>\n<td>1953—1956</td>\n<td>一五计划、三大改造、1954 年宪法</td>\n</tr>\n<tr>\n<td>曲折探索</td>\n<td>1956—1976</td>\n<td>大跃进、人民公社化、文化大革命</td>\n</tr>\n<tr>\n<td>伟大转折</td>\n<td>1978 至今</td>\n<td>十一届三中全会、改革开放、中国梦</td>\n</tr>\n</tbody>\n</table>\n<h2>两个“制度性节点”</h2>\n<p><strong>1954 年</strong>：第一届全国人民代表大会通过《中华人民共和国宪法》，确立人民代表大会制度——<strong>根本政治制度</strong>。</p>\n<p><strong>1956 年底</strong>：三大改造基本完成，生产资料私有制转变为社会主义公有制，<strong>社会主义制度在我国建立起来</strong>，中国进入社会主义初级阶段。</p>\n<blockquote>\n<p>这两个节点最容易混：1954 年是政治制度确立，1956 年是经济制度确立。</p>\n</blockquote>\n<h2>改革开放的逻辑</h2>\n<ul>\n<li><strong>起点</strong>：1978 年十一届三中全会，思想上重新确立实事求是，政治上以经济建设为中心，组织上形成以邓小平为核心的领导集体。</li>\n<li><strong>农村</strong>：家庭联产承包责任制（安徽凤阳小岗村），所有权与经营权分离。</li>\n<li><strong>城市</strong>：1984 年起国企改革，扩大企业自主权。</li>\n<li><strong>经济体制目标</strong>：1992 年十四大提出建立社会主义市场经济体制。</li>\n<li><strong>对外开放格局</strong>：经济特区 → 沿海开放城市 → 沿海经济开放区 → 内地，<strong>全方位、多层次、宽领域</strong>。</li>\n</ul>\n<h2>常考设问</h2>\n<ol>\n<li>为什么说十一届三中全会是“伟大的历史转折”？（三条路线的拨乱反正，开启改革开放和社会主义现代化建设新时期）</li>\n<li>土地改革与三大改造的区别？（前者废除封建土地所有制，建立农民土地所有制，仍是私有；后者把私有制变为公有制）</li>\n<li>一五计划为什么优先发展重工业？（工业基础薄弱、国防需要、苏联经验）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>新中国成立<strong>没有立即</strong>建立社会主义制度，1956 年三大改造完成才建立。</li>\n<li>土地改革后土地是<strong>农民私有</strong>，不是公有；农业合作化后才变为集体所有。</li>\n<li>抗美援朝（1950—1953）的目的不只是援助朝鲜，更是<strong>保家卫国</strong>。</li>\n<li>“一五”计划超额完成，但<strong>没有实现工业化</strong>，只是开始改变工业落后面貌。</li>\n</ul>", "课时": [{"册别": "八年级下册", "课序": 1, "课题": "中华人民共和国成立", "易错点": "《共同纲领》起临时宪法作用，不是正式宪法，第一部宪法是 1954 年；西藏和平解放标志“祖国大陆获得统一”，表述要准确，不要写成“全国统一”；一届政协代行全国人大职权，1954 年人大召开后政协转为统一战线组织", "知识点": ["第一届政协：1949 年 9 月在北平召开，通过《共同纲领》，起临时宪法作用；确定国旗、国歌、国都、纪年；选举毛泽东为中央人民政府主席", "开国大典：1949 年 10 月 1 日，天安门广场，宣告中华人民共和国中央人民政府成立", "西藏和平解放：1951 年，西藏地方政府派代表到北京谈判并签订协议，标志祖国大陆获得统一", "国内意义：开辟了中国历史新纪元，中国人民从此站起来了，成为国家的主人", "国际意义：壮大了世界和平民主和社会主义的力量"]}, {"册别": "八年级下册", "课序": 2, "课题": "抗美援朝", "易错点": "抗美援朝是 1950—1953 年，彭德怀任司令员；《朝鲜停战协定》1953 年 7 月签订，不是 1950；黄继光是上甘岭战役，邱少云是潜伏中被烧牺牲，两人事迹不能混；抗美援朝是“保家卫国”，不是单纯对外援助", "知识点": ["1950 年 6 月朝鲜内战爆发，美国出兵干涉并派第七舰队侵入台湾海峡，威胁中国安全", "1950 年 10 月，中国人民志愿军在彭德怀率领下开赴朝鲜，抗美援朝", "重要战役：上甘岭战役，黄继光用胸膛堵枪眼，邱少云烈火烧身不动", "1953 年 7 月，美国被迫在《朝鲜停战协定》上签字，抗美援朝战争胜利", "意义：打破了美军不可战胜的神话，捍卫了新中国安全，提高了中国的国际地位，为国内建设赢得相对稳定的和平环境", "抗美援朝精神：爱国主义、革命英雄主义、革命乐观主义、国际主义"]}, {"册别": "八年级下册", "课序": 3, "课题": "土地改革", "易错点": "土地改革是 1950—1952 年，废除的是封建土地所有制，实行农民土地所有制（土地仍归私有，不是公有）；三大改造（1956）才是把土地变为集体所有，两者不能混；土地改革后土地归农民所有，不是国家所有", "知识点": ["背景：封建土地制度下，地主占有大量土地，农民受剥削，严重阻碍农村经济和中国社会发展", "1950 年，中央人民政府颁布《中华人民共和国土地改革法》，规定废除地主阶级封建剥削的土地所有制，实行农民的土地所有制", "到 1952 年底，除部分少数民族地区外，全国大陆基本完成土地改革", "结果：约 3 亿无地少地农民分到土地，成为土地的主人", "意义：彻底摧毁了在我国延续两千多年的封建土地制度，消灭了地主阶级；农民翻了身，生产积极性提高；巩固了新生政权，为工业化建设准备了条件"]}, {"册别": "八年级下册", "课序": 4, "课题": "新中国工业化的起步和人民代表大会制度的确立", "易错点": "一五计划是 1953—1957 年，重点是重工业，不是轻工业；长春一汽是中国第一个汽车制造厂，不是鞍钢（钢铁）；1954 年宪法是我国第一部社会主义类型的宪法，不是第一部宪法（共同纲领是临时宪法性质）；人民代表大会制度是根本政治制度", "知识点": ["背景：新中国成立初期工业基础薄弱，门类不全，水平落后", "1953—1957 年第一个五年计划，集中主要力量发展重工业，建立国家工业化和国防现代化的初步基础", "成就：鞍山钢铁公司扩建、长春第一汽车制造厂、沈阳第一机床厂、武汉长江大桥、川藏青藏新藏公路", "1954 年 9 月，第一届全国人民代表大会在北京召开，制定《中华人民共和国宪法》", "宪法规定：中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主国家；一切权力属于人民", "意义：这是我国第一部社会主义类型的宪法，人民代表大会制度是我国的根本政治制度"]}, {"册别": "八年级下册", "课序": 5, "课题": "三大改造", "易错点": "改造方式是合作社和公私合营，不是人民公社（人民公社化运动始于 1958 年，二者常被混）；对资本主义工商业实行的是赎买政策而非无偿没收，这是中国区别于苏联的做法；三大改造 1956 年底“基本完成”，表述不要写成“彻底完成”", "知识点": ["农业改造：1953 年起，国家引导农民组织起来，参加农业生产合作社，走集体化和共同富裕的道路", "手工业改造：引导手工业者组织手工业生产合作社", "资本主义工商业改造：从加工订货、统购包销到公私合营，实行赎买政策，实现了和平过渡", "赎买政策：国家按合营时资本家的资本付给定息，是社会主义改造的创举", "完成时间：1956 年底，三大改造基本完成", "实质：生产资料私有制向社会主义公有制转变", "意义：标志着社会主义基本制度在我国建立起来，我国进入社会主义初级阶段"]}, {"册别": "八年级下册", "课序": 6, "课题": "艰辛探索与建设成就", "易错点": "中共八大是正确的探索开端，不是失误；“大跃进”是 1958 年，特点是高指标、瞎指挥、浮夸风、共产风；人民公社化运动强调“一大二公”，与家庭联产承包责任制方向相反；两弹一星是六七十年代成就，不是文革的成果", "知识点": ["1956 年中共八大召开，指出国内主要矛盾已转变为人民对于建立先进工业国的要求同落后农业国现实之间的矛盾，是探索社会主义道路的良好开端", "1958 年“大跃进”和人民公社化运动，片面追求高速度、高指标，违背客观经济规律，加上自然灾害，造成严重经济困难", "1961 年起实行“调整、巩固、充实、提高”方针，经济逐步恢复", "1966—1976 年“文化大革命”，给党、国家和各族人民带来新中国成立后最严重的挫折", "建设成就：大庆油田（王进喜）、两弹一星（邓稼先、钱学森）、籼型杂交水稻（袁隆平）、人工合成结晶牛胰岛素"]}, {"册别": "八年级下册", "课序": 7, "课题": "伟大的历史转折", "易错点": "十一届三中全会是 1978 年 12 月，不是 1979；会议作出的是“以经济建设为中心”和“改革开放”决策；“真理标准问题讨论”是会议的思想准备，不是会议内容；这次会议是转折点，不是改革的完成", "知识点": ["背景：“文化大革命”结束后，“两个凡是”的方针束缚思想；1978 年真理标准问题的大讨论，肯定“实践是检验真理的唯一标准”", "1978 年 12 月，中共十一届三中全会在北京召开", "内容：冲破“左”的错误的严重束缚，确定了解放思想、开动脑筋、实事求是、团结一致向前看的指导方针；果断停止“以阶级斗争为纲”，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策", "意义：是新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设新时期", "此后平反冤假错案，拨乱反正全面展开"]}, {"册别": "八年级下册", "课序": 8, "课题": "经济体制改革", "易错点": "家庭联产承包责任制没有改变土地公有制，说“分田到户把土地分给农民”是错的；提出建立社会主义市场经济体制目标的是 1992 年中共十四大；城市经济体制改革全面展开是 1984 年", "知识点": ["背景：十一届三中全会后，人民公社体制下“大锅饭”挫伤农民积极性，农业生产长期徘徊", "农村改革：1978 年安徽凤阳小岗村农民率先实行分田包干到户，随后推广为家庭联产承包责任制", "土地性质：土地仍归集体所有，农民获得生产经营自主权，改变的是经营方式而非所有制", "城市改革：1984 年起全面展开，重点是国有企业改革，扩大企业自主权，实行政企分开", "目标确立：1992 年中共十四大提出建立社会主义市场经济体制的目标", "意义：调动了生产者和经营者的积极性，促进了经济发展和人民生活水平提高"]}, {"册别": "八年级下册", "课序": 9, "课题": "对外开放", "易错点": "深圳是经济特区，不是特别行政区（香港、澳门是特别行政区）；首批四个特区是深圳、珠海、汕头、厦门，不含海南（1988 年）；中国加入 WTO 是 2001 年；特区“特”在经济政策，不是政治制度", "知识点": ["1980 年，深圳、珠海、汕头、厦门设立经济特区；1988 年海南建省并设经济特区", "特区“特”在实行特殊的经济政策和经济管理体制，不是政治制度特殊", "1984 年开放大连、天津、青岛、上海、广州等 14 个沿海城市", "此后开辟沿海经济开放区（长三角、珠三角、闽南三角区），开放内地", "2001 年，中国加入世界贸易组织（WTO）", "格局：经济特区—沿海开放城市—沿海经济开放区—内地，全方位、多层次、宽领域"]}, {"册别": "八年级下册", "课序": 10, "课题": "建设中国特色社会主义", "易错点": "十二大提出“中国特色社会主义”命题，十三大阐述初级阶段理论，十四大提出市场经济体制，十五大确立邓小平理论——四个会议内容不能混；南方谈话是 1992 年，不是 1991；邓小平理论在十五大写入党章", "知识点": ["1982 年中共十二大，邓小平提出“走自己的道路，建设有中国特色的社会主义”", "1987 年中共十三大，阐述社会主义初级阶段理论，提出“一个中心、两个基本点”的基本路线", "1992 年邓小平南方谈话，强调发展才是硬道理，进一步解放思想", "1992 年中共十四大，提出建立社会主义市场经济体制", "1997 年中共十五大，把邓小平理论确立为党的指导思想", "此后形成“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，构成中国特色社会主义理论体系"]}, {"册别": "八年级下册", "课序": 11, "课题": "为实现中国梦而努力奋斗", "易错点": "“两个一百年”分别对应建党一百年（2021）和新中国成立一百年（2049）；新发展理念是五个：创新、协调、绿色、开放、共享，顺序不要漏；全面建成小康社会是 2021 年实现，不是 2020 年宣布目标就完成", "知识点": ["2012 年，习近平提出实现中华民族伟大复兴的“中国梦”", "“两个一百年”奋斗目标：到建党一百年时全面建成小康社会；到新中国成立一百年时建成富强民主文明和谐美丽的社会主义现代化强国", "新发展理念：创新、协调、绿色、开放、共享", "2021 年，我国全面建成小康社会，历史性地解决了绝对贫困问题", "“一带一路”倡议：丝绸之路经济带和 21 世纪海上丝绸之路，促进共同发展", "青年责任：把个人理想融入国家发展"]}]}, {"专题": "中国古代政治制度的演变", "适用": "七年级上册、七年级下册", "概述": "中国古代政治制度的核心是两条线——中央与地方的权力分配，皇权与相权的此消彼长。抓住“中央集权不断加强、皇权不断强化”这一个趋势，二十多个朝代的地方制度与中枢机构就能串成一条线。", "关键词": ["分封制", "郡县制", "三省六部", "行省制", "军机处"], "正文HTML": "<h2>一条主线</h2>\n<p><strong>地方权力越来越小，皇帝权力越来越大。</strong></p>\n<h2>地方行政制度</h2>\n<table>\n<thead>\n<tr>\n<th>朝代</th>\n<th>制度</th>\n<th>关键点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>西周</td>\n<td>分封制</td>\n<td>授民授疆土，诸侯有较大独立性，后期导致割据</td>\n</tr>\n<tr>\n<td>秦</td>\n<td>郡县制</td>\n<td>中央直接任免，<strong>官僚政治取代贵族政治</strong>的标志</td>\n</tr>\n<tr>\n<td>西汉初</td>\n<td>郡国并行</td>\n<td>封国势力膨胀，汉武帝推恩令削弱</td>\n</tr>\n<tr>\n<td>元</td>\n<td>行省制</td>\n<td>中国省制的开端，加强了对边疆的管辖</td>\n</tr>\n<tr>\n<td>明</td>\n<td>废行省设三司</td>\n<td>权力分散，互相牵制</td>\n</tr>\n</tbody>\n</table>\n<h2>中央中枢机构</h2>\n<table>\n<thead>\n<tr>\n<th>朝代</th>\n<th>机构</th>\n<th>变化</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>秦</td>\n<td>丞相、太尉、御史大夫</td>\n<td>三公九卿，丞相掌行政</td>\n</tr>\n<tr>\n<td>隋唐</td>\n<td>三省六部</td>\n<td>中书决策、门下审议、尚书执行，<strong>分割相权</strong></td>\n</tr>\n<tr>\n<td>宋</td>\n<td>分化事权</td>\n<td>设参知政事、枢密使、三司使，进一步分割</td>\n</tr>\n<tr>\n<td>明</td>\n<td>废丞相、设内阁</td>\n<td>朱元璋废丞相，皇权空前强化</td>\n</tr>\n<tr>\n<td>清</td>\n<td>军机处</td>\n<td>雍正设立，跪受笔录，<strong>君主专制达到顶峰</strong></td>\n</tr>\n</tbody>\n</table>\n<h2>三条选官线索</h2>\n<p>世袭（西周）→ 察举（汉）→ 九品中正（魏晋）→ <strong>科举（隋唐至清末）</strong>。<br />\n科举制创立于隋炀帝设进士科，1905 年废除，是古代最公平的选官方式，也是“寒门出贵子”的制度基础。</p>\n<h2>常考设问</h2>\n<ol>\n<li>郡县制与分封制的根本区别是什么？（官员由中央任免、不世袭，vs 世袭、有封地）</li>\n<li>三省六部制的作用？（分工明确、相互牵制，分割相权、加强皇权）</li>\n<li>军机处设立说明了什么？（君主专制发展到顶峰，封建制度走向衰落）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>郡县制在春秋战国已出现，<strong>秦朝是全面推行</strong>，不是首创。</li>\n<li>行省制是<strong>元朝</strong>创立，不是明朝；明朝废行省设三司。</li>\n<li>内阁不是“宰相机构”，是皇帝的顾问机构，<strong>没有法定决策权</strong>。</li>\n<li>科举制正式创立是<strong>隋炀帝</strong>设进士科，隋文帝是分科考试的开端；不是唐朝创立。</li>\n</ul>", "课时": [{"册别": "七年级上册", "课序": 4, "课题": "夏商周的更替", "易错点": "夏朝建立是约公元前 2070 年，禹建立；启继位标志世袭制开始，不是禹；牧野之战是周武王打败商纣王，不是商汤灭夏（那是鸣条之战）；西周灭亡是公元前 771 年犬戎攻破镐京，不是被诸侯所灭", "知识点": ["约公元前 2070 年，禹建立夏朝，这是中国历史上第一个王朝", "禹死后，其子启继位，世袭制代替禅让制，“公天下”变为“家天下”", "约公元前 1600 年，汤灭夏建商；商朝后期盘庚迁都到殷", "公元前 1046 年，周武王在牧野之战中大败商军，建立西周，定都镐京", "分封制：周王把土地和人民分给宗亲、功臣，封为诸侯；诸侯要服从周王命令、向周王进献贡物、随从作战", "分封制的作用：稳定周初政治形势，扩大统治范围；后期诸侯势力坐大，导致分裂", "公元前 771 年，犬戎攻破镐京，西周灭亡"]}, {"册别": "七年级上册", "课序": 9, "课题": "秦统一中国", "易错点": "县制春秋战国已出现，但全面推行郡县制始于秦朝，不要说“秦朝首创县”；“焚书坑儒”属秦朝暴政，与本题的巩固统一措施要分开答；灵渠沟通的是湘江与漓江，不是黄河与长江", "知识点": ["秦灭六国：公元前 230—前 221 年，嬴政先后灭韩赵魏楚燕齐，建立秦朝，定都咸阳", "皇帝制度：嬴政自称“始皇帝”，总揽全国军政大权", "中央官制：丞相、太尉、御史大夫，合称三公，分管行政、军事、监察", "地方制度：废分封、行郡县，郡下设县，郡县长官由朝廷直接任免", "巩固统一的措施：统一文字为小篆、统一货币为圆形方孔半两钱、统一度量衡、统一车轨修驰道、开凿灵渠、北击匈奴修长城", "疆域：东至东海，西到陇西，北至长城一带，南达南海"]}, {"册别": "七年级上册", "课序": 12, "课题": "汉武帝巩固大一统王朝", "易错点": "“推恩令”是主父偃建议、汉武帝实行，核心是“分而削之”，不是直接削藩（那是景帝的削藩引七国之乱）；“罢黜百家，尊崇儒术”不是禁绝其他学派，而是确立儒学正统地位；五铢钱是汉武帝统一铸造的，不是汉初；卫青、霍去病击匈奴是军事措施，不是和亲", "知识点": ["政治：颁布“推恩令”，允许诸侯王将封地分给子弟，削弱诸侯势力；建立刺史制度，监视地方官吏与豪强", "思想：接受董仲舒建议，“罢黜百家，尊崇儒术”，把儒家学说立为正统思想，在长安兴办太学", "经济：把铸币权收归中央，统一铸造五铢钱；实行盐铁官营、专卖；平抑物价", "军事：派卫青、霍去病北击匈奴", "作用：从政治、思想、经济、军事上巩固了大一统局面，使西汉王朝进入鼎盛时期"]}, {"册别": "七年级上册", "课序": 13, "课题": "东汉的兴衰", "易错点": "东汉定都洛阳，西汉定都长安；光武中兴是刘秀（光武帝），不是汉武帝；“外戚宦官交替专权”的根源是皇帝年幼、君主专制体制，不是某个人品德问题；黄巾起义是 184 年张角领导，是东汉末年，不是西汉末年", "知识点": ["公元 9 年，王莽夺权建新朝，西汉灭亡；王莽改制失败，引发绿林、赤眉起义", "公元 25 年，刘秀建立东汉，定都洛阳，史称“光武中兴”", "光武帝措施：多次下令释放奴婢，减轻刑法，裁并郡县、整顿吏治，惩处贪官污吏", "中期以后，皇帝大多年幼继位，出现外戚与宦官交替专权的局面，政治腐败", "豪强地主势力膨胀，土地兼并严重，农民负担加重", "184 年，张角领导黄巾起义，起义军头裹黄巾，最终被镇压，但东汉政权从此衰败"]}, {"册别": "七年级上册", "课序": 16, "课题": "三国鼎立", "易错点": "官渡之战（200）是曹操胜袁绍，赤壁之战（208）是孙刘胜曹操，两次战役胜负方不同；三国鼎立正式形成是 229 年孙权称帝，不是 220 年曹丕称帝；曹操本人没有称帝，称帝的是其子曹丕；卫温到夷洲是孙吴，230 年，说明台湾自古与大陆联系", "知识点": ["200 年官渡之战，曹操以少胜多打败袁绍，为统一北方奠定基础", "208 年赤壁之战，孙刘联军以火攻大败曹军，为三国鼎立局面形成奠定基础", "220 年曹丕称帝，国号魏，定都洛阳；221 年刘备称帝，国号汉（蜀），定都成都；229 年孙权称帝，国号吴，定都建业", "三国鼎立局面形成", "经济：曹魏重视农业、兴修水利、推行屯田；蜀汉发展经济、改善与西南少数民族关系；孙吴开发江东，造船业发达，230 年派卫温率船队到达夷洲（今台湾）"]}, {"册别": "七年级上册", "课序": 19, "课题": "北魏政治和北方民族大交融", "易错点": "孝文帝改革的核心是“汉化”，不是“胡化”；迁都洛阳是 494 年，统一北方是 439 年，两件事不同；北魏是鲜卑族政权，不是匈奴；改革措施中“改汉姓”如拓跋改为元", "知识点": ["4 世纪后期，鲜卑族拓跋部建立北魏；439 年统一北方", "494 年，孝文帝迁都洛阳", "改革措施：说汉语、穿汉服、改汉姓、与汉族联姻、采用汉族官制律令", "作用：促进民族交融，增强北魏实力，为隋唐统一奠定基础", "北方民族交融表现：生产生活相互学习，语言、服饰、习俗互相影响，民族隔阂渐消"]}, {"册别": "七年级下册", "课序": 1, "课题": "隋朝的统一与灭亡", "易错点": "大运河的中心是洛阳，不是长安；涿郡即今北京，余杭即今杭州；科举制“正式确立”的标志是隋炀帝设进士科，隋文帝只是“开始分科考试”；隋朝建立 581 年、统一 589 年，两个年份不要混", "知识点": ["隋朝建立：581 年，杨坚（隋文帝）夺取北周政权，定都长安", "统一全国：589 年灭陈，结束长期分裂局面", "大运河：605 年起隋炀帝开凿，以洛阳为中心，北抵涿郡，南至余杭，全长两千多公里", "运河四段：永济渠、通济渠、邗沟、江南河；连接海河、黄河、淮河、长江、钱塘江五大水系", "科举制：隋文帝开始用分科考试选拔官员，隋炀帝设进士科，标志科举制正式确立", "隋朝灭亡：隋炀帝滥用民力、暴政，618 年在农民起义中灭亡"]}, {"册别": "七年级下册", "课序": 6, "课题": "北宋的政治", "易错点": "北宋并未完成全国统一，只是结束了五代十国的分裂割据，北方长期与辽、西夏并立；“重文轻武”不是不重视军事，而是文人掌军、武将受制，目的是防止武将专权；转运使管财政、通判监督知州，职责不能互换；科举取士名额大幅增加是“重文”的重要表现，但与唐朝科举要区分；王安石变法属于北宋中期的富国强兵改革，不是北宋建立之初的政策", "知识点": ["北宋建立：960 年，赵匡胤（宋太祖）发动陈桥兵变，建立宋朝，定都东京（开封）", "收兵权：杯酒释兵权，解除禁军将领兵权，禁军由皇帝直接控制", "收行政权：文臣知州，设通判监督知州，分化事权", "收财权：设转运使，把地方财赋收归中央", "重文轻武：文官掌军、扩大科举取士规模、武举地位下降、武将受牵制", "影响：加强了中央集权，有利于政权稳定和社会安定；但造成军队战斗力弱、财政负担沉重"]}, {"册别": "七年级下册", "课序": 11, "课题": "元朝的统治", "易错点": "西藏正式归属中央管辖始于元朝（宣政院），不是唐朝（唐是和亲、会盟）；澎湖巡检司是元朝设的，管辖澎湖与琉球（台湾）；行省制度始于元朝，是中国省制开端；元朝中央不设门下省", "知识点": ["元朝疆域空前辽阔，“北逾阴山，西极流沙，东尽辽左，南越海表”", "中央设中书省掌行政、枢密院掌军事、御史台掌监察", "地方推行行省制度，行省下设路、府、州、县，加强对地方的控制", "设宣政院管理西藏地区，西藏正式成为中央政府直接管辖的地方行政区域", "设澎湖巡检司管辖澎湖和琉球（今台湾），这是中央政府首次在台湾地区正式设立行政机构", "设北庭都元帅府等管理西域", "意义：行省制度是中国省制的开端，加强了中央对边疆的管辖，促进统一多民族国家发展"]}, {"册别": "七年级下册", "课序": 14, "课题": "明朝的统治", "易错点": "朱元璋废除的是丞相制度（不是宰相这一称呼的取消），秦以来的丞相制到此终结；锦衣卫是明太祖设，东厂是明成祖设；八股取士考试范围是四书五经，答卷用八股文；明朝定都应天（南京），明成祖迁北京", "知识点": ["1368 年朱元璋建立明朝，定都应天府（今南京）；后明成祖迁都北京", "政治：废除丞相制度和中书省，权分六部，直接对皇帝负责；设三司分掌地方权力", "特务：设锦衣卫，明成祖设东厂，合称“厂卫”，监视官民", "科举：实行八股取士，考试范围限于“四书”“五经”，答卷须按固定格式，不能自由发挥", "影响：君主专制空前加强；八股取士束缚思想，阻碍科技文化发展"]}, {"册别": "七年级下册", "课序": 20, "课题": "清朝君主专制的强化", "易错点": "军机处是雍正设立，不是康熙；军机大臣没有决策权，只是跪受笔录、传达旨意，标志君主专制达到顶峰；闭关锁国不是完全禁绝，而是严格限制，1757 年后仅留广州一处通商；文字狱在康熙、雍正、乾隆三朝都有，不是只有乾隆；设军机处与兴文字狱是同一目的的两个手段——强化皇权、控制思想", "知识点": ["雍正时设立军机处，军机大臣由皇帝钦定，只能秉承皇帝旨意办事，军机处成为中枢机构", "影响：军机处的设立使君主专制进一步强化，中央集权达到顶峰", "文字狱：康熙、雍正、乾隆三朝，从知识分子的文字中摘取字句罗织罪名，制造冤狱", "影响：禁锢思想言论，摧残人才，阻碍社会进步", "闭关锁国：严格限制对外贸易，乾隆时只开广州一处，由广州十三行统一经营管理", "影响：对西方殖民者的侵略起过一定自卫作用，但阻碍了中国与世界的交流，使中国逐渐落伍"]}]}, {"专题": "中国古代经济与对外交往", "适用": "七年级上册、七年级下册", "概述": "这条线考两件事——经济重心怎么从黄河流域转到长江流域，对外交往怎么从“开放”走到“闭关”。前者决定人口与城市格局，后者直接连到近代的被动挨打。", "关键词": ["丝绸之路", "经济重心南移", "郑和下西洋", "闭关锁国", "海外贸易"], "正文HTML": "<h2>一条主线</h2>\n<p><strong>经济南移 → 南方成为财赋重心 → 海外贸易兴盛 → 明清转向闭关 → 落后于世界。</strong></p>\n<h2>经济重心南移三步</h2>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>时间</th>\n<th>表现</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>奠定基础</td>\n<td>东汉末至三国</td>\n<td>北方战乱，人口南迁，江南得到开发</td>\n</tr>\n<tr>\n<td>开始南移</td>\n<td>唐中后期（安史之乱后）</td>\n<td>北方人口再次大量南迁</td>\n</tr>\n<tr>\n<td>完成南移</td>\n<td>南宋</td>\n<td>“苏湖熟，天下足”，南方赋税收入超过北方</td>\n</tr>\n</tbody>\n</table>\n<p>南移的原因可以归成四条：北方战乱、人口南迁带来劳动力和技术、南方自然条件优越、统治者重视。</p>\n<h2>农业与手工业的关键点</h2>\n<ul>\n<li><strong>唐代</strong>：曲辕犁、筒车；丝织业、陶瓷业发达；唐三彩。</li>\n<li><strong>宋代</strong>：占城稻推广，水稻跃居粮食产量首位；“苏湖熟，天下足”。</li>\n<li><strong>宋代手工业</strong>：景德镇成为瓷都；广州、泉州、明州的造船业居当时世界前列。</li>\n<li><strong>明代</strong>：引进原产美洲的玉米、甘薯、马铃薯等高产作物。</li>\n</ul>\n<h2>对外交往的四个阶段</h2>\n<table>\n<thead>\n<tr>\n<th>时期</th>\n<th>事件</th>\n<th>特点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>西汉</td>\n<td>张骞通西域、丝绸之路</td>\n<td>陆上通道开辟，双向交流</td>\n</tr>\n<tr>\n<td>唐朝</td>\n<td>玄奘西行、鉴真东渡、遣唐使</td>\n<td>兼容并包，主动学习与传播</td>\n</tr>\n<tr>\n<td>宋元</td>\n<td>海外贸易兴盛，设市舶司</td>\n<td>海路为主，政府鼓励</td>\n</tr>\n<tr>\n<td>明朝</td>\n<td>郑和下西洋（1405—1433）</td>\n<td>规模空前，但<strong>不计经济效益</strong>的政治行为</td>\n</tr>\n<tr>\n<td>清朝</td>\n<td>闭关锁国，仅留广州一口</td>\n<td>严格限制，导致落后</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>郑和下西洋比哥伦布早半个多世纪，但<strong>没有带来资本的原始积累</strong>，这是它与新航路开辟最本质的差别。</p>\n</blockquote>\n<h2>常考设问</h2>\n<ol>\n<li>经济重心南移的原因和表现？</li>\n<li>郑和下西洋与新航路开辟有什么不同？（目的、性质、结果、影响四个维度）</li>\n<li>闭关锁国政策的影响？（一定程度上自卫，但隔绝了交流，中国逐渐落伍）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>丝绸之路开通是<strong>张骞通西域之后</strong>（公元前 138 年首次出使），不是张骞一人“开辟”就完成。</li>\n<li>经济重心南移<strong>完成于南宋</strong>，不是唐朝。</li>\n<li>郑和下西洋最远到达<strong>非洲东海岸和红海沿岸</strong>，不是欧洲。</li>\n<li>闭关锁国不是“完全禁绝”，是<strong>严格限制</strong>，保留广州一处通商。</li>\n</ul>", "课时": [{"册别": "七年级上册", "课序": 2, "课题": "原始农耕生活", "易错点": "河姆渡在长江流域（浙江），种水稻；半坡在黄河流域（陕西），种粟——南北不能颠倒；河姆渡是干栏式建筑（防潮），半坡是半地穴式（保暖），建筑形式与气候直接相关；北京人用打制石器，河姆渡、半坡用磨制石器", "知识点": ["距今约 7000 年，浙江余姚河姆渡遗址，长江流域，种植水稻，住干栏式建筑，会挖水井，制作黑陶", "距今约 6000 年，陕西西安半坡遗址，黄河流域，种植粟，住半地穴式圆形房屋，制作彩陶", "共同点：使用磨制石器，从事农业生产，饲养家畜，聚落定居", "原始农业兴起的重要标志：农作物种植、家畜饲养、聚落、磨制石器的发展", "意义：为古代文明社会的形成奠定了重要基础"]}, {"册别": "七年级上册", "课序": 14, "课题": "沟通中外文明的“丝绸之路”", "易错点": "张骞出使的直接目的（夹击匈奴）并未达成，但客观上开辟了通往西域的道路，答题要区分“直接目的”与“客观作用”；西域都护设于公元前 60 年，晚于张骞出使；丝绸之路是双向交流，不是单向输出", "知识点": ["汉代西域：今甘肃玉门关、阳关以西，葱岭以东的广大地区", "张骞通西域：公元前 138 年、前 119 年两次出使，目的是联络大月氏夹击匈奴", "西域都护：公元前 60 年设置，标志西域正式归属中央政权管辖", "陆上丝绸之路：长安→河西走廊→西域→中亚、西亚→欧洲，因丝绸在此路上大量西传而得名", "海上丝绸之路：汉武帝时开辟，从东南沿海出发，经中南半岛南下，可至印度半岛南端", "交流内容：丝绸、瓷器、铁器与冶铁技术西传；良种马、香料、玻璃、核桃、苜蓿、乐器与乐舞东来；佛教经丝绸之路传入中国"]}, {"册别": "七年级下册", "课序": 3, "课题": "盛唐气象", "易错点": "曲辕犁是唐朝改进的耕地工具，筒车是灌溉工具，两者功能不同；唐三彩是陶器，不是瓷器；李白是“诗仙”，杜甫是“诗圣”，杜甫生活于唐由盛转衰时期；文成公主入藏是唐太宗时期，嫁松赞干布", "知识点": ["农业：改进犁耕技术，出现曲辕犁；创制筒车灌溉；水稻种植面积扩大，茶叶生产兴盛", "手工业：丝织业技术高超；陶瓷业发达，越窑青瓷、邢窑白瓷、唐三彩", "商业：长安是当时中国的政治经济文化中心，也是国际性大都市，坊市分开", "民族交往：唐太宗被尊为“天可汗”；文成公主入藏嫁松赞干布；唐蕃和亲促进汉藏交流", "文学艺术：李白（诗仙）、杜甫（诗圣）、白居易；书法颜真卿、柳公权；绘画阎立本、吴道子", "社会风气：兼容并包，胡风盛行，女性地位相对较高"]}, {"册别": "七年级下册", "课序": 4, "课题": "唐朝的中外文化交流", "易错点": "鉴真是“东渡”日本，玄奘是“西行”天竺，方向不能颠倒；《大唐西域记》是玄奘口述、弟子记录，不是他亲笔；鉴真东渡六次才成功，前五次失败；唐朝对外交往是双向的，不只是输出", "知识点": ["日本多次派遣唐使来华，学习唐朝制度、文化、技术，回国后推动日本社会改革", "鉴真六次东渡日本，第六次成功，在日本传授佛法与医药、建筑、艺术，主持修建唐招提寺", "玄奘西行天竺（今印度）取经，游历十余年，回国后主持译经，口述《大唐西域记》", "唐朝与朝鲜半岛、波斯、阿拉伯等都有往来，长安聚集各国使节、商人、留学生", "特点：双向交流，既输出文化，也吸收外来文明"]}, {"册别": "七年级下册", "课序": 9, "课题": "宋代经济的发展", "易错点": "经济重心南移完成于南宋，不是北宋（北宋是南移的关键期）；交子是北宋四川地区的纸币，是世界上最早的纸币，不是元朝；市舶司管理海外贸易，不是国内商业；占城稻原产越南，北宋时引入福建，不是本土品种；“苏湖熟，天下足”指的是太湖流域，不是整个江南；宋代海外贸易最远到达阿拉伯半岛和非洲东海岸", "知识点": ["农业：从越南引进占城稻，水稻产量跃居粮食作物首位；苏州、湖州成为粮仓（“苏湖熟，天下足”）；茶桑种植扩大", "手工业：南方丝织业超过北方；景德镇成为瓷都；广州、泉州等地造船业发达，指南针用于航海", "商业：城市商业打破坊市界限，出现早市、夜市；四川地区出现世界上最早的纸币“交子”；设立市舶司管理海外贸易", "经济重心南移：到南宋时期，江南地区经济发展超过北方，经济重心南移完成"]}, {"册别": "七年级下册", "课序": 13, "课题": "宋元时期的科技与中外交通", "易错点": "活字印刷是北宋毕昇发明，不是东汉蔡伦（蔡伦改进造纸术）；指南针用于航海是宋代，不是战国；火药发明于唐朝，宋元广泛用于军事；马可·波罗是元朝来华，不是明朝", "知识点": ["印刷术：北宋毕昇发明活字印刷术（泥活字），比欧洲早约四百年；元代王祯发明转轮排字法", "指南针：战国时已有司南，宋代制成罗盘并用于航海，后传入欧洲", "火药：唐朝已有记载，宋元时期广泛用于军事，后传入阿拉伯和欧洲", "中外交通：宋代海路发达，广州、泉州是重要港口；元代陆路畅通，驿站制度完善", "马可·波罗元朝来华，著《马可·波罗行纪》，激起欧洲人对东方的向往", "意义：四大发明外传推动了世界文明进程"]}, {"册别": "七年级下册", "课序": 15, "课题": "明朝的对外关系", "易错点": "郑和下西洋最远到达非洲东海岸和红海沿岸，不是美洲；郑和是“和平交往”，与后来的殖民扩张性质不同；戚继光抗倭是抵御日本海盗，不是抵御正规军；葡萄牙人获得澳门居住权是明朝后期", "知识点": ["1405—1433 年，郑和七次下西洋，先后到达亚洲和非洲 30 多个国家和地区，最远到达非洲东海岸和红海沿岸", "条件：明朝国力强盛，造船技术先进，指南针用于航海，朝廷支持", "意义：世界航海史上的空前壮举，增进了中国与亚非国家的相互了解与友好往来", "戚继光组建“戚家军”，在台州九战九捷，与俞大猷等荡平东南沿海倭患", "明朝后期，葡萄牙人攫取在澳门的居住权", "特点：前期以和平交往为主（郑和），后期转向防御与抵抗（抗倭、御葡）"]}, {"册别": "七年级下册", "课序": 19, "课题": "清朝前期社会经济的发展", "易错点": "摊丁入亩是雍正时期推行，废除了人头税，不是康熙；“滋生人丁，永不加赋”是康熙晚年（1712）；晋商、徽商是商帮，不是手工业组织；人口增长既带来劳动力也带来人地矛盾，要两面看", "知识点": ["农业：推广高产作物（玉米、甘薯），耕地面积扩大，粮食产量提高", "税制：1712 年“滋生人丁，永不加赋”；雍正时推行“摊丁入亩”，把丁税平均摊入田赋", "手工业：丝织、棉织、制瓷、采矿等发展，出现规模较大的手工工场", "商业：形成晋商、徽商等大商帮；工商业市镇繁荣", "人口：乾隆末年突破 3 亿，带来人地矛盾、生态压力", "总体：清朝前期经济恢复发展，出现“康乾盛世”，但仍以自给自足的自然经济为主体"]}]}, {"专题": "资本主义制度的确立与扩展", "适用": "九年级上册、九年级下册", "概述": "资本主义不是一天建成的。它先有思想准备（文艺复兴），再有地理空间（新航路与殖民），然后逐个国家用革命或改革确立制度，最后在 19 世纪中期向全球扩展。这条线的因果顺序不能乱。", "关键词": ["文艺复兴", "新航路开辟", "资产阶级革命", "明治维新", "美国内战"], "正文HTML": "<h2>一条主线：四个环节</h2>\n<table>\n<thead>\n<tr>\n<th>环节</th>\n<th>事件</th>\n<th>作用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>思想</td>\n<td>文艺复兴</td>\n<td>把人从神权下解放出来</td>\n</tr>\n<tr>\n<td>空间</td>\n<td>新航路开辟、殖民掠夺</td>\n<td>形成世界市场，积累原始资本</td>\n</tr>\n<tr>\n<td>制度</td>\n<td>英、美、法革命</td>\n<td>确立资本主义制度</td>\n</tr>\n<tr>\n<td>扩展</td>\n<td>俄、美、日改革与内战</td>\n<td>制度向全球扩展</td>\n</tr>\n</tbody>\n</table>\n<h2>三次资产阶级革命对照</h2>\n<table>\n<thead>\n<tr>\n<th>项目</th>\n<th>英国</th>\n<th>美国</th>\n<th>法国</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>时间</td>\n<td>1640—1688</td>\n<td>1775—1783</td>\n<td>1789—1799</td>\n</tr>\n<tr>\n<td>导火线</td>\n<td>苏格兰人民起义</td>\n<td>波士顿倾茶事件</td>\n<td>三级会议召开</td>\n</tr>\n<tr>\n<td>文件</td>\n<td>《权利法案》</td>\n<td>《独立宣言》、1787 年宪法</td>\n<td>《人权宣言》</td>\n</tr>\n<tr>\n<td>政体</td>\n<td>君主立宪</td>\n<td>联邦制共和</td>\n<td>共和制</td>\n</tr>\n<tr>\n<td>特点</td>\n<td>妥协、渐进</td>\n<td>双重性质（民族独立 + 资产阶级革命）</td>\n<td>最彻底、最曲折</td>\n</tr>\n</tbody>\n</table>\n<h2>19 世纪中期的扩展</h2>\n<ul>\n<li><strong>俄国 1861 年改革</strong>：废除农奴制，是<strong>自上而下的资产阶级性质改革</strong>，保留大量封建残余。</li>\n<li><strong>美国内战（1861—1865）</strong>：《解放黑人奴隶宣言》《宅地法》，扫清了资本主义发展的又一障碍，维护了国家统一。</li>\n<li><strong>日本明治维新（1868）</strong>：废藩置县、殖产兴业、文明开化、征兵制，走上资本主义道路，但保留军国主义传统。</li>\n</ul>\n<blockquote>\n<p>三者共同点：都为资本主义发展提供了<strong>自由劳动力</strong>和<strong>国内市场</strong>。</p>\n</blockquote>\n<h2>常考设问</h2>\n<ol>\n<li>为什么说文艺复兴是“发现人”的运动？（以人文主义为核心，肯定人的价值与现世幸福，反对神学束缚）</li>\n<li>新航路开辟的影响？（世界连为整体、贸易中心转移、殖民扩张开始、欧洲资本积累）</li>\n<li>明治维新与戊戌变法的结果为何不同？（前者有倒幕运动推翻旧政权、有相对独立的国家环境；后者依靠无实权的皇帝，顽固派力量强大）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>英国资产阶级革命结束的标志是 <strong>1688 年光荣革命</strong>，不是 1649 年处死查理一世。</li>\n<li>美国独立战争既是民族解放战争，也是资产阶级革命，<strong>双重性质</strong>。</li>\n<li>法国大革命中《人权宣言》发表于 1789 年，<strong>早于</strong>《拿破仑法典》（1804）。</li>\n<li>俄国 1861 年改革和日本明治维新都是<strong>资产阶级性质</strong>的改革，但都不是资产阶级领导的。</li>\n</ul>", "课时": [{"册别": "九年级上册", "课序": 13, "课题": "西欧经济和社会的发展", "易错点": "中世纪晚期出现的租地农场和手工工场是资本主义萌芽的表现，不是传统庄园经济的延续；租地农场主与农业工人之间是雇佣关系，这是资本主义性质的生产关系；富裕农民、骑士等成为农村中的新兴力量，不是传统封建贵族；手工工场中的工人与雇主是雇佣关系，不是学徒关系；这些变化为文艺复兴和新航路开辟提供了经济基础，因果顺序不能倒置", "知识点": ["11 世纪后开展垦殖运动，耕地面积扩大，农业生产效率提高", "租地农场出现：富裕农民租种土地，雇用少地或无地农民劳动，形成雇佣关系", "手工业发展：手工业者脱离农业和领主控制，逐渐形成集中生产的手工工场", "雇佣关系的出现，标志着西欧资本主义生产的萌芽", "社会结构变化：富裕农民、骑士成为农村中坚力量；市民阶层分化出早期的资产阶级"]}, {"册别": "九年级上册", "课序": 14, "课题": "文艺复兴运动", "易错点": "文艺复兴不是简单“复兴”古代希腊罗马文化，而是借古典文化之名宣传资产阶级新思想；但丁是“先驱”，不能说文艺复兴始于但丁一个人；莎士比亚是英国人，不是意大利人", "知识点": ["兴起：14 世纪意大利，最早出现资本主义萌芽", "核心思想：人文主义，以人为中心而不是以神为中心，肯定人的价值和尊严", "但丁：创作长诗《神曲》，抨击教会的贪婪腐化，被誉为文艺复兴的先驱", "达·芬奇：《蒙娜丽莎》《最后的晚餐》，把艺术与科学结合", "莎士比亚：《罗密欧与朱丽叶》《哈姆雷特》，反映人文主义思想", "扩展：15—16 世纪从意大利扩展到欧洲其他国家", "意义：促进了人们思想的大解放，为欧洲资本主义的产生和发展奠定了思想文化基础"]}, {"册别": "九年级上册", "课序": 15, "课题": "探寻新航路", "易错点": "哥伦布到达的是美洲，他至死认为是印度，所以称当地居民为“印第安人”；麦哲伦本人在菲律宾死亡，完成环球航行的是他的船队；四条航线的方向不要混：迪亚士、达·伽马向东，哥伦布向西，麦哲伦向西环球", "知识点": ["原因：欧洲商品经济迅速发展，出现寻金热；《马可·波罗行纪》激起对东方的向往；奥斯曼帝国控制传统商路", "条件：造船技术进步、罗盘应用、地圆说流行、王室支持", "迪亚士：1487—1488 年到达非洲好望角", "达·伽马：1497—1498 年绕过好望角到达印度", "哥伦布：1492 年横渡大西洋到达美洲", "麦哲伦船队：1519—1522 年完成环球航行", "影响：世界开始连为一个整体，欧洲大西洋沿岸工商业繁荣，促进资本主义发展；同时开启了殖民掠夺"]}, {"册别": "九年级上册", "课序": 16, "课题": "早期殖民掠夺", "易错点": "三角贸易三段各运什么都容易记反，记法：出程“货去非洲”，中程“人去美洲”，归程“钱回欧洲”；“资本原始积累”与“资本积累”不是一回事，前者靠掠夺，后者靠剥削剩余价值；最早殖民的是葡西，不是英国", "知识点": ["最早进行殖民扩张的是葡萄牙和西班牙", "英国后来居上：1588 年击败西班牙“无敌舰队”，18 世纪成为最大的殖民国家", "三角贸易：出程从欧洲运廉价工业品到非洲；中程把黑奴运到美洲；归程把美洲的金银和原料运回欧洲", "殖民掠夺的方式：抢劫金银、垄断贸易、贩卖黑奴、经营种植园", "影响：为欧洲资本主义发展提供了资本原始积累，同时给亚非拉人民带来深重灾难"]}, {"册别": "九年级上册", "课序": 17, "课题": "君主立宪制的英国", "易错点": "《权利法案》的作用是限制王权、确立议会主权，不要说成“建立了君主立宪制”这一个动作完成；光荣革命是不流血的政变，不是战争；1649 年建立的是共和国，克伦威尔后来实行的是护国主独裁，两者不同", "知识点": ["1640 年议会重新召开，英国资产阶级革命爆发", "1649 年查理一世被处死，英国宣布为共和国", "克伦威尔掌权后实行独裁统治，革命出现曲折", "1660 年斯图亚特王朝复辟", "1688 年“光荣革命”，不流血政变，确立议会的主导地位", "1689 年《权利法案》限制王权，保障议会权力，君主立宪制逐步形成"]}, {"册别": "九年级上册", "课序": 18, "课题": "美国的独立", "易错点": "《独立宣言》发表于 1776 年，1783 年才是英国承认独立；1787 年宪法存在承认奴隶制的局限，评价要两面；三权分立的思想源自孟德斯鸠，不是美国首创", "知识点": ["1775 年来克星顿枪声，独立战争爆发", "1776 年 7 月 4 日《独立宣言》发表，宣告美国诞生，被称为“第一个人权宣言”", "1777 年萨拉托加大捷，成为战争的转折点", "1783 年英国承认美国独立", "1787 年美国宪法确立联邦制和三权分立原则，是世界上第一部资产阶级成文宪法", "华盛顿当选首任总统"]}, {"册别": "九年级上册", "课序": 19, "课题": "法国大革命和拿破仑帝国", "易错点": "《人权宣言》是 1789 年法国文献，不要与美国《独立宣言》混；拿破仑称帝却维护革命成果，评价要辩证，不能只说“复辟倒退”；《拿破仑法典》是民法典，不是宪法", "知识点": ["1789 年 7 月 14 日巴黎人民攻占巴士底狱，法国大革命爆发", "1789 年制宪议会通过《人权宣言》，宣告人生来自由平等，私有财产神圣不可侵犯", "1792 年法国建立共和国；1793 年路易十六被处死", "大革命摧毁了法国的君主专制统治，传播了自由民主思想", "1804 年拿破仑称帝，建立法兰西第一帝国，颁布《拿破仑法典》", "《拿破仑法典》体现资产阶级原则，巩固了大革命的成果，成为许多国家民法的参照", "1815 年滑铁卢战役失败，拿破仑帝国覆亡"]}, {"册别": "九年级下册", "课序": 2, "课题": "俄国的改革", "易错点": "彼得一世改革开启了近代化，但没废除农奴制；1861 年废除农奴制的是亚历山大二世，不是彼得一世；农奴获得自由但土地要赎买，改革不彻底；1861 年改革是自上而下的资产阶级性质改革", "知识点": ["17 世纪俄国是一个封闭落后的封建农奴制国家", "彼得一世改革（1682 年起）：学习西方，创建新式军队，发展工商业，兴办学校，推行欧化生活方式，迁都圣彼得堡", "影响：开启俄国近代化进程，增强了国力，但农奴制未废除", "19 世纪中期，农奴制严重阻碍资本主义发展；克里米亚战争失败暴露落后", "1861 年，亚历山大二世颁布法令废除农奴制：农奴获得人身自由，可以改变身份、自由转换职业；但获得土地须高价赎买", "影响：是俄国历史上的重大转折点，推动资本主义发展，但保留大量封建残余"]}, {"册别": "九年级下册", "课序": 3, "课题": "美国内战", "易错点": "内战焦点是奴隶制存废，不是关税（关税是表现形式）；《解放黑人奴隶宣言》1862 年颁布，只宣布叛乱各州奴隶自由；林肯 1865 年遇刺，内战同年结束；内战被称为“第二次资产阶级革命”，第一次是独立战争", "知识点": ["背景：北方资本主义工商业与南方种植园经济矛盾加剧，焦点是奴隶制的存废", "1860 年林肯当选总统，南方各州发动叛乱，1861 年内战爆发", "1862 年，林肯颁布《宅地法》和《解放黑人奴隶宣言》，宣布叛乱各州的奴隶获得自由", "作用：调动了农民和黑人的积极性，扭转战局", "1865 年北方获胜，维护了国家统一，废除了奴隶制", "意义：美国历史上的第二次资产阶级革命，为资本主义进一步发展创造条件", "局限：黑人虽然获得自由，但在政治、经济上仍受歧视"]}, {"册别": "九年级下册", "课序": 4, "课题": "日本明治维新", "易错点": "明治维新是自上而下的改革，不是革命；改革保留了天皇制和大量封建残余，不能只讲“成功”；与戊戌变法同期比较时，要说明两者结果不同的原因（前提、力量对比、措施推行力度）", "知识点": ["背景：1853 年美国佩里舰队叩关（黑船事件），日本面临民族危机；幕府统治腐朽，倒幕运动兴起", "政治前提：1868 年明治政府成立，改年号明治，迁都东京", "政治措施：废藩置县，加强中央集权，废除封建身份制度", "军事措施：实行征兵制，建立新式军队", "经济措施：殖产兴业，引进西方技术，发展近代工业", "社会生活：提倡文明开化，向欧美学习，发展教育", "政治制度：1889 年颁布《大日本帝国宪法》，确立君主立宪制，但天皇仍握有很大权力", "影响：使日本走上发展资本主义的道路，成为亚洲强国；但保留大量封建残余，军国主义色彩浓厚，很快走上对外侵略扩张道路"]}]}, {"专题": "两次世界大战与国际格局演变", "适用": "九年级下册", "概述": "20 世纪的国际格局经历了三次重组——凡尔赛—华盛顿体系、雅尔塔体系、多极化趋势。每一次重组的起点都是一场大战或一次格局崩塌，终点都是新的力量对比。", "关键词": ["第一次世界大战", "凡尔赛华盛顿体系", "第二次世界大战", "冷战", "多极化"], "正文HTML": "<h2>一条主线</h2>\n<p><strong>一战 → 凡尔赛—华盛顿体系 → 二战 → 雅尔塔体系（冷战）→ 苏联解体 → 多极化趋势。</strong></p>\n<h2>两次大战对照</h2>\n<table>\n<thead>\n<tr>\n<th>项目</th>\n<th>第一次世界大战</th>\n<th>第二次世界大战</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>时间</td>\n<td>1914—1918</td>\n<td>1939—1945</td>\n</tr>\n<tr>\n<td>根源</td>\n<td>帝国主义政治经济发展不平衡</td>\n<td>同上，加上经济危机与法西斯扩张</td>\n</tr>\n<tr>\n<td>导火线</td>\n<td>萨拉热窝事件</td>\n<td>德国突袭波兰</td>\n</tr>\n<tr>\n<td>性质</td>\n<td>帝国主义掠夺战争</td>\n<td>世界反法西斯战争</td>\n</tr>\n<tr>\n<td>转折</td>\n<td>—</td>\n<td>斯大林格勒保卫战</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>凡尔赛—华盛顿体系</td>\n<td>雅尔塔体系，联合国成立</td>\n</tr>\n</tbody>\n</table>\n<h2>三次格局重组</h2>\n<p><strong>凡尔赛—华盛顿体系（1919—1939）</strong>：《凡尔赛条约》处置德国，《九国公约》确立在华“门户开放”，是<strong>战胜国对战败国的宰割</strong>，埋下二战隐患。</p>\n<p><strong>雅尔塔体系（1945—1991）</strong>：美苏两分天下，冷战开始。标志是杜鲁门主义（1947），经济上是马歇尔计划与经互会，军事上是北约与华约。</p>\n<p><strong>多极化趋势（1991 至今）</strong>：苏联解体、两极格局终结，出现“一超多强”，趋势是多极化。<strong>多极化是趋势，不是已经形成的格局</strong>。</p>\n<h2>经济全球化的三个支柱</h2>\n<p>世界贸易组织（WTO，1995）、联合国（1945）、以及区域合作组织。中国 2001 年加入 WTO，是深度融入全球化的关键一步。</p>\n<h2>常考设问</h2>\n<ol>\n<li>为什么说凡尔赛—华盛顿体系不能持久？（对战败国掠夺性处置、战胜国分赃不均、没有解决根本矛盾）</li>\n<li>冷战的表现有哪些？（政治杜鲁门主义、经济马歇尔计划、军事北约，以及德国的分裂、古巴导弹危机）</li>\n<li>世界多极化趋势的表现？（欧盟、日本、中国、俄罗斯、发展中国家等多支力量上升）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>一战的性质是<strong>帝国主义战争</strong>，二战是<strong>世界反法西斯战争</strong>，不能混。</li>\n<li>二战全面爆发的标志是 1939 年德国突袭波兰，<strong>不是</strong> 1937 年七七事变（那是中国全民族抗战开始）。</li>\n<li>冷战开始的标志是 <strong>1947 年杜鲁门主义出台</strong>，不是丘吉尔“铁幕演说”（那是序幕）。</li>\n<li>两极格局结束的标志是 <strong>1991 年苏联解体</strong>，不是 1989 年东欧剧变。</li>\n</ul>", "课时": [{"册别": "九年级下册", "课序": 8, "课题": "第一次世界大战", "易错点": "萨拉热窝事件是导火线，不是根本原因（根本原因是帝国主义发展不平衡）；三国同盟是德奥意，三国协约是英法俄，意后来倒向协约国；凡尔登战役 1916 年，被称为“绞肉机”；一战是帝国主义战争，塞尔维亚一方具有民族解放性质", "知识点": ["根源：帝国主义国家政治经济发展不平衡，后起的德国要求重新瓜分世界", "两大军事集团：德、奥匈、意组成三国同盟；英、法、俄组成三国协约", "导火线：1914 年 6 月萨拉热窝事件，奥匈帝国皇储被塞尔维亚青年刺杀", "1914 年 7 月，奥匈对塞尔维亚宣战，一战爆发", "重要战役：1916 年凡尔登战役，被称为“凡尔登绞肉机”，双方伤亡七十多万人", "1917 年美国参战；俄国十月革命后退出战争", "1918 年 11 月，德国投降，一战结束", "性质：非正义的帝国主义掠夺战争", "影响：削弱了帝国主义和殖民主义力量；促成了俄国十月革命；给人类带来巨大灾难"]}, {"册别": "九年级下册", "课序": 10, "课题": "《凡尔赛条约》和《九国公约》", "易错点": "《凡尔赛条约》是 1919 年对德和约，《九国公约》是 1921—1922 年华盛顿会议签订；国联由巴黎和会决定建立，但美国未加入；《九国公约》表面尊重中国主权，实质是共同支配中国；五四运动的导火线正是巴黎和会中国外交失败", "知识点": ["1919 年，巴黎和会召开，签订《凡尔赛条约》：重划德国疆界，阿尔萨斯—洛林归还法国；德国海外殖民地被瓜分；限制德国军备；德国负担巨额赔款", "巴黎和会还决定建立国际联盟（国联），实际被英法控制", "1921—1922 年，华盛顿会议召开，签订《九国公约》，宣称尊重中国主权、独立与领土完整，实际上使中国回到几个帝国主义国家共同支配的局面", "凡尔赛—华盛顿体系：确立了战后帝国主义在欧洲、西亚、非洲和亚太地区的新秩序", "中国：巴黎和会将德国在山东的权益转给日本，引发五四运动", "评价：体系暂时缓和了矛盾，但埋下新的冲突隐患，不可能长期维持"]}, {"册别": "九年级下册", "课序": 13, "课题": "罗斯福新政", "易错点": "新政是“国家干预”，不是社会主义计划经济，它维护的是资本主义制度；《全国工业复兴法》是核心立法；“以工代赈”是兴办公共工程解决就业，不是直接发钱；新政缓解危机但未消除危机根源", "知识点": ["1929 年 10 月，美国股市崩溃，经济大危机爆发，迅速波及整个资本主义世界", "危机特点：范围广、时间长、破坏大；表现为银行倒闭、企业破产、失业激增、农产品滞销", "1933 年，罗斯福就任美国总统，实行新政", "新政内容：整顿金融体系（银行休业整顿、存款保险）；加强对工业的计划指导（《全国工业复兴法》）；调整农业政策；推行“以工代赈”，兴办公共工程；建立社会保障制度", "特点：国家干预经济，在资本主义制度内部进行调整", "影响：使美国经济缓慢复苏，人民生活改善，增强了政府调控能力；但未从根本上消除危机"]}, {"册别": "九年级下册", "课序": 14, "课题": "法西斯国家的侵略扩张", "易错点": "意大利最早建立法西斯政权（1922），德国 1933 年，日本 1936 年军部法西斯专政；慕尼黑会议是 1938 年，英法出卖捷克斯洛伐克；绥靖政策的核心是牺牲小国利益换取和平，不是反法西斯；轴心国是德意日", "知识点": ["意大利：1922 年墨索里尼建立法西斯政权，最早建立法西斯统治", "德国：1933 年希特勒出任总理，纳粹党上台，建立法西斯专政；制造国会纵火案，打击共产党；迫害犹太人；撕毁《凡尔赛条约》，扩军备战", "日本：1936 年军部法西斯专政建立；1931 年发动九一八事变，1937 年发动七七事变", "1937 年，德、意、日结成轴心国集团", "1938 年慕尼黑会议，英法将捷克斯洛伐克苏台德地区割让给德国，绥靖政策达到顶峰", "绥靖政策的后果：助长法西斯侵略气焰，加速二战爆发"]}, {"册别": "九年级下册", "课序": 15, "课题": "第二次世界大战", "易错点": "二战全面爆发是 1939 年德国突袭波兰，不是 1937 年七七事变（中国抗战起点更早）；斯大林格勒战役是苏德战场转折，中途岛是太平洋转折，两者不能混；诺曼底登陆开辟的是欧洲第二战场；二战结束是 1945 年 9 月 2 日日本签署投降书", "知识点": ["1939 年 9 月 1 日，德国突袭波兰，英法对德宣战，二战全面爆发", "1941 年 6 月，德国进攻苏联，苏德战争爆发，二战规模扩大", "1941 年 12 月 7 日，日本偷袭珍珠港，太平洋战争爆发，二战达到最大规模", "1942 年 1 月，26 个国家签署《联合国家宣言》，世界反法西斯同盟正式形成", "转折：1942—1943 年斯大林格勒战役（苏德战场转折，也是二战重要转折点）；1942 年中途岛海战（太平洋战场转折）；1942 年阿拉曼战役（北非转折）", "1944 年 6 月 6 日，诺曼底登陆，开辟欧洲第二战场", "1945 年 2 月雅尔塔会议，决定彻底击败德国、成立联合国、苏联对日作战", "1945 年 5 月 8 日德国投降，9 月 2 日日本签署投降书，二战结束", "意义：彻底粉碎法西斯，维护了世界和平；推动民族解放运动；促成联合国成立；给人类留下深刻教训"]}, {"册别": "九年级下册", "课序": 16, "课题": "冷战", "易错点": "冷战开始的标志是 1947 年杜鲁门主义，不是 1946 年“铁幕演说”（那是序幕）；两极格局形成于 1955 年华约成立，不是北约成立；冷战结束的标志是 1991 年苏联解体", "知识点": ["含义：第二次世界大战后，以美国、苏联为首的两大集团之间既非战争又非和平的对峙与竞争状态", "序幕：1946 年丘吉尔发表“铁幕演说”", "开始标志：1947 年杜鲁门主义出台，宣称要遏制共产主义", "经济表现：1947 年美国推行马歇尔计划，援助西欧恢复经济", "军事表现：1949 年北约成立；1955 年华约成立，两极格局正式形成", "其他表现：柏林危机与德国分裂、古巴导弹危机、朝鲜战争、越南战争", "结束：1991 年苏联解体，两极格局终结，冷战结束", "影响：双方势均力敌，避免了新的世界大战爆发；但局部战争不断，世界长期不得安宁"]}, {"册别": "九年级下册", "课序": 20, "课题": "联合国与世界贸易组织", "易错点": "联合国 1945 年成立，总部纽约；安理会五大常任理事国是中、美、英、法、俄，拥有否决权；WTO 1995 年成立，中国 2001 年加入；WTO 是经济组织，联合国是综合性国际组织", "知识点": ["1945 年 10 月，联合国正式成立，总部设在美国纽约", "联合国宗旨：维护国际和平与安全，促进国际合作", "联合国主要机构：联合国大会、安全理事会（安理会）、秘书处等；安理会是维护国际和平与安全的主要机构，五大常任理事国拥有否决权", "中国是联合国创始会员国和安理会常任理事国", "1995 年 1 月 1 日，世界贸易组织（WTO）正式成立，取代关贸总协定", "WTO 宗旨：促进贸易自由化，解决贸易争端", "中国于 2001 年加入 WTO", "作用：联合国与 WTO 是维护世界和平、推动经济全球化的重要国际组织"]}, {"册别": "九年级下册", "课序": 21, "课题": "冷战后的世界格局", "易错点": "多极化是“趋势”，尚未最终形成，不能说“已经形成多极格局”；“一超多强”中的“一超”指美国；恐怖主义、霸权主义都是威胁和平的因素，不是只有战争；时代主题是和平与发展", "知识点": ["苏联解体后，两极格局终结，世界格局向多极化方向发展，呈现“一超多强”局面", "美国是唯一超级大国，欧盟、日本、中国、俄罗斯等成为重要力量中心", "威胁和平的因素：霸权主义、强权政治、地区冲突、民族宗教矛盾、恐怖主义", "冷战后局部战争：海湾战争、科索沃战争、伊拉克战争等", "时代主题：和平与发展", "中国主张：构建人类命运共同体，走和平发展道路，反对霸权主义", "多极化是长期趋势，尚未最终形成"]}]}, {"专题": "社会主义运动的发展", "适用": "九年级上册、九年级下册", "概述": "从理论到实践、从一国到多国、从辉煌到挫折，社会主义运动走了一条“理论—制度—模式—改革”的路。考查重点是政策之间的区别，尤其是新经济政策与战时共产主义、苏联模式与中国道路的差异。", "关键词": ["马克思主义", "十月革命", "新经济政策", "苏联模式", "苏联解体"], "正文HTML": "<h2>一条主线：四步</h2>\n<table>\n<thead>\n<tr>\n<th>步骤</th>\n<th>事件</th>\n<th>意义</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>理论</td>\n<td>1848《共产党宣言》</td>\n<td>马克思主义诞生，国际工人运动有了科学理论指导</td>\n</tr>\n<tr>\n<td>实践</td>\n<td>1871 巴黎公社</td>\n<td>无产阶级建立政权的<strong>第一次伟大尝试</strong>，但失败</td>\n</tr>\n<tr>\n<td>制度</td>\n<td>1917 十月革命</td>\n<td>建立世界上第一个社会主义国家</td>\n</tr>\n<tr>\n<td>模式</td>\n<td>1936 苏联模式形成</td>\n<td>高度集中，短期有效，长期僵化</td>\n</tr>\n<tr>\n<td>改革</td>\n<td>1985 戈尔巴乔夫改革</td>\n<td>失败，1991 苏联解体</td>\n</tr>\n</tbody>\n</table>\n<h2>苏俄（联）三次政策调整</h2>\n<table>\n<thead>\n<tr>\n<th>政策</th>\n<th>时间</th>\n<th>内容</th>\n<th>特点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>战时共产主义</td>\n<td>1918—1921</td>\n<td>余粮收集制、实物配给</td>\n<td>非常时期的应急措施，引发危机</td>\n</tr>\n<tr>\n<td>新经济政策</td>\n<td>1921—1928</td>\n<td>粮食税、允许私人经营中小企业、恢复商品货币关系</td>\n<td><strong>利用市场和商品货币关系发展经济</strong></td>\n</tr>\n<tr>\n<td>苏联模式</td>\n<td>1936 形成</td>\n<td>单一公有制、指令性计划、优先发展重工业、高度集权</td>\n<td>短期实现工业化，长期比例失调</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>新经济政策是列宁对小农国家如何建设社会主义的探索，<strong>不是退回到资本主义</strong>。</p>\n</blockquote>\n<h2>苏联模式的特征与弊端</h2>\n<p>特征是高度集中的计划经济体制和高度集权的政治体制。弊端有四个：片面发展重工业、农业轻工业长期落后、排斥市场机制、权力过分集中缺乏民主。这些弊端长期积累，是苏联解体的深层原因。</p>\n<h2>常考设问</h2>\n<ol>\n<li>十月革命的道路是什么？（中心城市武装起义，与中国的农村包围城市道路形成对比）</li>\n<li>新经济政策“新”在哪里？（允许多种经济成分并存，利用市场和商品货币关系）</li>\n<li>苏联解体的原因和启示？（体制僵化、改革失误、西方和平演变；启示是必须坚持从本国国情出发，坚持党的领导）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>巴黎公社是“第一次伟大尝试”，<strong>不是成功的社会主义革命</strong>，只存在 72 天。</li>\n<li>十月革命发生在 <strong>1917 年 11 月 7 日</strong>（俄历 10 月 25 日），推翻的是资产阶级临时政府。</li>\n<li>苏联模式形成标志是 <strong>1936 年新宪法</strong>，不是 1922 年苏联成立。</li>\n<li>苏联解体是 <strong>1991 年 12 月</strong>，戈尔巴乔夫辞职、阿拉木图宣言；东欧剧变在 1989—1990 年，两者不能混。</li>\n</ul>", "课时": [{"册别": "九年级上册", "课序": 21, "课题": "马克思主义的诞生和国际共产主义运动的兴起", "易错点": "马克思主义诞生的标志是 1848 年《共产党宣言》发表，不是《资本论》；巴黎公社是“第一次伟大尝试”，不是成功的社会主义革命，只存在了 72 天；巴黎公社不是马克思主义政党直接领导建立的", "知识点": ["工业革命后，资本主义制度的弊端日益暴露，工人运动兴起，为马克思主义诞生提供了社会条件", "马克思、恩格斯批判继承前人成果，创立了马克思主义理论", "1848 年《共产党宣言》发表，标志马克思主义的诞生", "《共产党宣言》揭示了资本主义必然灭亡、共产主义必然胜利的客观规律", "1871 年巴黎公社成立，是无产阶级建立政权的第一次伟大尝试", "欧仁·鲍狄埃创作《国际歌》，纪念巴黎公社"]}, {"册别": "九年级下册", "课序": 9, "课题": "列宁与十月革命", "易错点": "二月革命推翻沙皇专制，十月革命推翻资产阶级临时政府，两次革命性质不同；十月革命是 1917 年 11 月 7 日（俄历 10 月 25 日），公历与俄历差 13 天；十月革命建立的是苏维埃政权（无产阶级专政），不是资产阶级共和国", "知识点": ["1917 年 3 月，俄国爆发二月革命，推翻沙皇专制统治，形成资产阶级临时政府和工兵代表苏维埃两个政权并存的局面", "临时政府继续参加一战，社会矛盾激化", "列宁发表《四月提纲》，提出从资产阶级民主革命向社会主义革命过渡的任务", "1917 年 11 月 7 日（俄历 10 月 25 日），彼得格勒武装起义，攻占冬宫，十月革命胜利", "建立苏维埃政权，颁布《土地法令》《和平法令》，退出第一次世界大战", "意义：人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家；推动了国际社会主义运动的发展；鼓舞了殖民地半殖民地的民族解放斗争"]}, {"册别": "九年级下册", "课序": 11, "课题": "苏联的社会主义建设", "易错点": "新经济政策是列宁 1921 年实行，不是斯大林；苏联成立于 1922 年底，不是 1917；五年计划重点发展重工业，不是轻工业；苏联模式形成标志是 1936 年新宪法", "知识点": ["1921 年，列宁实行新经济政策：以征收粮食税代替余粮收集制；允许使用雇佣劳动力和出租土地；允许私人经营中小企业；实行按劳取酬的工资制", "新经济政策从国情出发，调动了生产者的积极性，促进国民经济恢复", "1922 年底，苏维埃社会主义共和国联盟（苏联）成立", "1928 年起，苏联实施两个五年计划，重点发展重工业，到 1937 年工业总产值跃居欧洲第一、世界第二", "20 世纪 30 年代推行农业集体化，建立集体农庄", "1936 年新宪法宣布苏联是“工农社会主义国家”，标志苏联模式（斯大林模式）形成", "苏联模式特点：高度集中的计划经济体制和高度集权的政治体制", "评价：短期内实现工业化，为反法西斯战争胜利奠定物质基础；但排斥市场、片面发展重工业、牺牲农业和农民利益，长期看弊端严重"]}, {"册别": "九年级下册", "课序": 18, "课题": "社会主义的发展与挫折", "易错点": "苏联解体是 1991 年 12 月，不是 1989 年（东欧剧变）；戈尔巴乔夫改革先经济后政治；“八一九事件”加速解体，不是解体本身；苏联解体标志两极格局结束，冷战也随之终结", "知识点": ["赫鲁晓夫改革：批判斯大林个人崇拜，推行农业改革，取得一定成效，但未从根本上突破苏联模式", "勃列日涅夫改革：重点发展重工业与军事，后期经济停滞", "戈尔巴乔夫改革：先经济后政治，提出“人道的、民主的社会主义”，放弃党的领导，造成思想混乱", "1991 年 8 月，苏联发生“八一九事件”，加速解体", "1991 年 12 月，苏联解体，两极格局结束", "东欧剧变：20 世纪 80 年代末 90 年代初，东欧各国社会制度发生根本变化", "教训：改革必须坚持正确方向，立足本国国情，不能照搬照抄，也不能放弃党的领导"]}]}, {"专题": "工业革命与全球化", "适用": "九年级上册、九年级下册", "概述": "两次工业革命把人类从手工工场带入工厂、再带入电气时代，世界市场由雏形走向最终形成，全球化由商品流动走向资本与信息流动。这条线的落点是“技术—生产—社会—世界格局”的连锁反应。", "关键词": ["工业革命", "第二次工业革命", "世界市场", "世贸组织", "现代社会"], "正文HTML": "<h2>两次工业革命对照</h2>\n<table>\n<thead>\n<tr>\n<th>项目</th>\n<th>第一次（18 世纪 60 年代—19 世纪中期）</th>\n<th>第二次（19 世纪六七十年代—20 世纪初）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>标志</td>\n<td>蒸汽机的改良与应用</td>\n<td>电力的广泛应用</td>\n</tr>\n<tr>\n<td>领先国家</td>\n<td>英国</td>\n<td>美国、德国</td>\n</tr>\n<tr>\n<td>主要发明</td>\n<td>珍妮机、改良蒸汽机、火车、汽船</td>\n<td>发电机、电动机、内燃机、汽车、飞机、电报电话</td>\n</tr>\n<tr>\n<td>能源</td>\n<td>煤炭</td>\n<td>电力、石油</td>\n</tr>\n<tr>\n<td>生产组织</td>\n<td>工厂制度</td>\n<td>垄断组织</td>\n</tr>\n<tr>\n<td>世界市场</td>\n<td>基本形成</td>\n<td>最终形成</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>第一次工业革命的标志性发明是<strong>改良蒸汽机</strong>（瓦特），不是珍妮机——珍妮机是开端，蒸汽机才是把人从手工推进到机器大生产的核心。</p>\n</blockquote>\n<h2>工业革命的三重影响</h2>\n<p><strong>技术层面</strong>：机器生产取代手工劳动，生产力空前提高。<br />\n<strong>社会层面</strong>：形成工业资产阶级与工业无产阶级两大对立阶级；城市化加速；环境污染、贫富分化等问题出现。<br />\n<strong>世界层面</strong>：资本主义世界市场形成，东方从属于西方，殖民扩张加剧。</p>\n<h2>全球化的三个阶段</h2>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>时间</th>\n<th>主要形式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>起步</td>\n<td>新航路开辟后</td>\n<td>商品流通、殖民掠夺</td>\n</tr>\n<tr>\n<td>发展</td>\n<td>工业革命后</td>\n<td>资本输出、原料与市场</td>\n</tr>\n<tr>\n<td>深化</td>\n<td>20 世纪 90 年代后</td>\n<td>生产国际化、信息流动、跨国公司与 WTO</td>\n</tr>\n</tbody>\n</table>\n<h2>常考设问</h2>\n<ol>\n<li>为什么工业革命首先发生在英国？（资本、劳动力、技术、市场四个条件，加上君主立宪制的政治保障）</li>\n<li>两次工业革命给中国带来了什么？（第一次：鸦片战争，被迫卷入世界市场；第二次：列强资本输出，民族工业艰难发展）</li>\n<li>如何看待全球化？（双刃剑：促进资源流动与经济增长，也扩大南北差距；对发展中国家既是机遇也是挑战）</li>\n</ol>\n<h2>易错提醒</h2>\n<ul>\n<li>第一次工业革命<strong>发明者多为工匠</strong>，第二次<strong>科学与技术紧密结合</strong>，这是两者最本质的差别。</li>\n<li>工业革命开始的标志是珍妮机的发明（1765），<strong>完成标志</strong>是机器大生产基本取代手工劳动。</li>\n<li>世界市场“最终形成”是<strong>第二次工业革命后</strong>（20 世纪初），不是第一次。</li>\n<li>中国加入世界贸易组织是 <strong>2001 年</strong>，不是 1978 年或 1992 年。</li>\n</ul>", "课时": [{"册别": "九年级上册", "课序": 20, "课题": "第一次工业革命", "易错点": "工业革命开始于棉纺织业（珍妮机），不是冶金业；瓦特是改良蒸汽机，不是发明蒸汽机；开始的标志是珍妮机发明，完成的标志是机器大生产取代手工劳动，不要与“核心标志是蒸汽机广泛应用”混为一谈；首先发生在英国的根本原因是资本主义制度的建立提供了政治保障，不只是资源丰富；工业革命后世界市场基本形成，最终形成要等到第二次工业革命", "知识点": ["前提：英国率先确立君主立宪制；殖民扩张积累资本；圈地运动提供劳动力；海外市场不断扩大", "开始：18 世纪 60 年代，哈格里夫斯发明珍妮机，棉纺织业率先出现机器生产", "核心发明：1785 年瓦特改良的蒸汽机投入使用，人类进入“蒸汽时代”", "交通变革：1825 年史蒂芬孙设计的蒸汽机车试车成功，铁路时代到来", "生产组织：现代工厂制度确立，生产集中在工厂中进行", "影响：生产力极大提高，英国成为“世界工厂”；社会日益分裂为工业资产阶级和工业无产阶级两大对立阶级"]}, {"册别": "九年级下册", "课序": 5, "课题": "第二次工业革命", "易错点": "第一次工业革命以蒸汽为动力，第二次以电力、内燃机为核心；爱迪生发明电灯（实用白炽灯），不是发明电；本茨制造汽车，莱特兄弟试飞飞机；垄断组织出现在第二次工业革命时期", "知识点": ["时间：19 世纪六七十年代开始，20 世纪初完成", "特点：科学研究与工业生产紧密结合，多个国家同时展开", "电力：发电机、电动机问世，电力广泛应用于照明、动力，人类进入“电气时代”", "内燃机：19 世纪 80 年代发明，推动汽车（本茨）、飞机（莱特兄弟）问世；石油成为新能源", "化学工业：合成染料、塑料、人造纤维等", "通信：电话、无线电报", "影响：生产力极大提高；出现垄断组织，主要资本主义国家向帝国主义过渡；世界市场最终形成"]}, {"册别": "九年级下册", "课序": 6, "课题": "工业化国家的社会变化", "易错点": "城市化伴随工业化出现，不是先有城市再有工业；妇女大量进入工厂是工业化的结果，但同工不同酬长期存在；社会问题（贫富分化、污染）是工业化的伴生物，不能因此否定工业化的历史进步性", "知识点": ["人口增长：工业革命后生产力提高、医疗改善，欧美人口迅速增长", "劳动力结构变化：农业人口比重下降，工业和服务业人口上升；妇女走出家庭进入工厂", "教育普及：1802 年英国通过第一部《工厂法》，此后各国推行义务教育，大众教育推广", "城市化：大量人口涌入城市，城市规模扩大，19 世纪中期英国城市人口超过总人口一半", "社会问题：贫富分化加剧；城市卫生、住房、犯罪问题突出；环境污染严重", "认识：工业化是双刃剑，既带来进步，也带来新的社会矛盾"]}, {"册别": "九年级下册", "课序": 20, "课题": "联合国与世界贸易组织", "易错点": "联合国 1945 年成立，总部纽约；安理会五大常任理事国是中、美、英、法、俄，拥有否决权；WTO 1995 年成立，中国 2001 年加入；WTO 是经济组织，联合国是综合性国际组织", "知识点": ["1945 年 10 月，联合国正式成立，总部设在美国纽约", "联合国宗旨：维护国际和平与安全，促进国际合作", "联合国主要机构：联合国大会、安全理事会（安理会）、秘书处等；安理会是维护国际和平与安全的主要机构，五大常任理事国拥有否决权", "中国是联合国创始会员国和安理会常任理事国", "1995 年 1 月 1 日，世界贸易组织（WTO）正式成立，取代关贸总协定", "WTO 宗旨：促进贸易自由化，解决贸易争端", "中国于 2001 年加入 WTO", "作用：联合国与 WTO 是维护世界和平、推动经济全球化的重要国际组织"]}, {"册别": "九年级下册", "课序": 22, "课题": "不断发展的现代社会", "易错点": "信息时代以计算机与互联网为标志；环境问题具有全球性，需要国际合作解决；妇女地位提高但仍存在不平等，不能一概而论；可持续发展强调经济、社会、环境协调，不是只讲环保", "知识点": ["科技：20 世纪四五十年代以来，计算机与互联网迅速发展，人类进入信息时代；生物技术、新材料、新能源等取得突破", "互联网的影响：改变生产生活方式，促进信息交流；也带来网络安全、隐私等问题", "人口：世界人口快速增长，带来粮食、就业、资源压力", "环境：全球气候变暖、臭氧层破坏、酸雨、水污染、土地荒漠化等问题突出", "社会：妇女地位提高，但性别平等仍待推进", "应对：走可持续发展道路，加强国际合作；中国提出人与自然和谐共生、构建人类命运共同体"]}]}];
const bar = document.getElementById('bar');
const list = document.getElementById('list');
let cur = -1;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
bar.innerHTML = '<span class="chip on" data-i="-1">全部专题</span>' +
  TOPICS.map((t,i)=>`<span class="chip" data-i="${i}">${i+1}. ${esc(t['专题'])}</span>`).join('');
function render(){
  const rows = cur < 0 ? TOPICS : [TOPICS[cur]];
  list.innerHTML = rows.map(t => `
    <section class="topic">
      <h2>${TOPICS.indexOf(t)+1}. ${esc(t['专题'])}</h2>
      <div class="meta">${esc(t['适用'])} ｜ 关联 ${t['课时'].length} 课</div>
      <div>${t['关键词'].map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>
      <div class="lead">${esc(t['概述'])}</div>
      <div class="md">${t['正文HTML']}</div>
      <details class="lessons"><summary>展开关联课时与易错点（${t['课时'].length}）</summary>
        ${t['课时'].map(l=>`<div class="lesson"><b>${esc(l['册别'])} 第${l['课序']}课 ${esc(l['课题'])}</b><div class="err">${esc(l['易错点'])}</div></div>`).join('')}
      </details>
    </section>`).join('');
}
bar.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  bar.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); cur = Number(c.dataset.i); render();
  window.scrollTo({top:0,behavior:'smooth'});
});
render();
</script>
