name: 补录课时
description: 领一课还没录入的课时，录完提 PR
title: "[补录] "
labels: ["补录课时"]
body:
  - type: dropdown
    id: book
    attributes:
      label: 册别
      description: 这一课属于哪一册
      options:
        - 七年级上册
        - 七年级下册
        - 八年级上册
        - 八年级下册
        - 九年级上册
        - 九年级下册
    validations:
      required: true

  - type: input
    id: lesson
    attributes:
      label: 课序与课题
      placeholder: 第5课 甲午中日战争与列强瓜分中国狂潮
    validations:
      required: true

  - type: textarea
    id: focus
    attributes:
      label: 本课打算重点整理什么
      description: 比如"重点补易错点"或"配套史料还没找到"
      placeholder: 易错点先整理，史料课后再补
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 开工前确认
      options:
        - label: 已确认该课尚未录入（搜过 index/ 对应目录）
          required: true
        - label: 知道要复制 templates/课时模板.md
          required: true
